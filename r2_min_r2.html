<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R2 길드 자금 관리</title>
<style>
:root{
  --bg:#0b1016; --top:#080c11; --panel:#141b24; --panel2:#1a232e; --head:#1f2a37; --field:#0d131a;
  --line:#2a3646; --line2:#3b4c61; --text:#e7edf4; --muted:#93a1b3;
  --teal:#35c4a6; --teal-soft:rgba(53,196,166,.15);
  --green:#46d391; --green-soft:rgba(70,211,145,.14);
  --red:#ff7272; --red-soft:rgba(255,114,114,.14);
  --coin:#f2b84b; --coin-soft:rgba(242,184,75,.16);
  --blue:#6cb2ff; --blue-soft:rgba(108,178,255,.15);
  --purple:#c9a0ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:110px;overflow-y:scroll;scrollbar-gutter:stable;overflow-anchor:none}   /* 스크롤바 자리를 항상 확보 → 탭마다 가로 폭이 바뀌지 않음 */
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.55 "Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px} h3{font-size:14px}
.muted{color:var(--muted)} .small{font-size:12px}
.pre{white-space:pre-line;margin:0}
.nowrap{white-space:nowrap}

/* ---------- 상단 ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--top);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-size:19px}
.brand h1 small{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.save{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2)}
.save.ok{color:var(--teal)} .save.warn{color:var(--red);border-color:var(--red)}
.bk{font-size:12px;color:var(--muted)} .bk.warn{color:var(--coin)}
/* 헤더 상태 표시: 글자 길이가 바뀌어도 폭이 변하지 않게 고정 */
.brand{min-height:46px}
.tools .save,.tools .bk{display:inline-block;box-sizing:border-box;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
#adminStatus{width:108px} #cloudStatus{width:200px} #saveStatus{width:190px} #bkInfo{width:150px;text-align:right}
#bkInfo:empty{visibility:hidden}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tab{background:var(--panel);border:1px solid var(--line);border-bottom:1px solid transparent;border-top:3px solid transparent;border-radius:8px 8px 0 0;
  box-sizing:border-box;height:44px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:14px;line-height:1.2;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap}   /* 모든 탭(버튼/링크) 크기 동일 */
.tab:hover{color:var(--text)}
.tab.on{background:var(--bg);color:var(--text);border-top-color:var(--teal);border-bottom-color:var(--bg)}   /* 활성 탭도 크기 변화 없음 */
main{max-width:1240px;margin:0 auto;padding:20px 16px 90px;min-height:calc(100vh - 130px);overflow-x:clip;overflow-anchor:none}
main>:first-child{margin-top:0}

/* ---------- 카드(항목 구분) ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:20px;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;
  background:var(--head);background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--teal)) 18%,var(--head)),var(--head) 70%);
  border-bottom:1px solid var(--line);border-left:5px solid var(--c,var(--teal))}
.card-b{padding:16px}
.c-teal{--c:var(--teal)} .c-coin{--c:var(--coin)} .c-green{--c:var(--green)} .c-red{--c:var(--red)} .c-blue{--c:var(--blue)} .c-purple{--c:var(--purple)}
.sub{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.sub-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--head);border-left:4px solid var(--c);font-weight:700}

/* ---------- 버튼/입력 ---------- */
.btn{border:1px solid var(--line2);background:var(--panel2);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--teal);background:#223040}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#04241d}
.btn.primary:hover{filter:brightness(1.1);background:var(--teal)}
.btn.gold{background:var(--coin);border-color:var(--coin);color:#2b1c00}
.btn.gold:hover{filter:brightness(1.08);background:var(--coin)}
.btn.danger{background:var(--red);border-color:var(--red);color:#2a0606}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.lg{padding:11px 22px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
input,select,textarea{background:var(--field);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;min-width:0}
input[type=number]{text-align:right}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);padding:0}
input::placeholder,textarea::placeholder{color:#5f6f82}
textarea{width:100%;resize:vertical}
.w100{width:100%}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:12px;color:var(--muted)}
.inl{display:flex;align-items:center;gap:6px}
.mi{display:inline-flex;flex-direction:column;gap:2px;vertical-align:top}
.mi input{width:140px}
.field .mi{display:flex} .field .mi input{width:100%}
[data-money]{text-align:right}
input.big{font-size:22px;font-weight:800;height:50px}
.mfmt{font-size:11.5px;color:var(--coin);min-height:16px;text-align:right;white-space:nowrap}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;align-items:start}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips[hidden]{display:none}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.in{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.chip.out{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.chip.coin{color:var(--coin);border-color:var(--coin);background:var(--coin-soft)}
.chip.blue{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
.chip.cls-kn{color:#ff9f7a;border-color:#ff9f7a;background:rgba(255,159,122,.13)}
.chip.cls-rg{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.chip.cls-el{color:var(--teal);border-color:var(--teal);background:var(--teal-soft)}
.chip.cls-sm{color:var(--purple);border-color:var(--purple);background:rgba(201,160,255,.14)}
.chip.cls-as{color:#ff6b8a;border-color:#ff6b8a;background:rgba(255,107,138,.13)}
/* 클래스 아이콘 (파일 안에 직접 그린 SVG — 인터넷 없이 모든 기기에서 같은 모양) */
.chip[class*="cls-"]{display:inline-flex;align-items:center;gap:4px}
.ci{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.chip.sm2 .ci{width:12px;height:12px}
.clsico{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);flex:none}
.clsico .ci{width:16px;height:16px}
.clsico.cls-kn{color:#ff9f7a;border-color:#ff9f7a} .clsico.cls-rg{color:var(--green);border-color:var(--green)} .clsico.cls-el{color:var(--teal);border-color:var(--teal)}
.clsico.cls-sm{color:var(--purple);border-color:var(--purple)} .clsico.cls-as{color:#ff6b8a;border-color:#ff6b8a} .clsico.none{color:var(--muted);border-style:dashed}
.clscell{display:flex;gap:6px;align-items:center}
.chip.sm2{font-size:11px;padding:0 7px;margin-left:6px;font-weight:600}
.chip.link{cursor:pointer;padding:3px 11px}
.chip.link:hover{filter:brightness(1.35);border-color:var(--teal);color:var(--text)}
.notice{padding:8px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--field);font-size:13px;margin:10px 0 0}
.notice.ok{border-color:var(--teal);color:var(--teal)}
.notice.warn{border-color:var(--coin);color:var(--coin)}
.notice.bad{border-color:var(--red);color:var(--red)}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--line2);background:var(--field);border-radius:0 6px 6px 0}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--red)} .coin{color:var(--coin)}

/* ---------- 입출금 입력 폼 ---------- */
.ledform{display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(280px,1fr);gap:22px}
@media (max-width:860px){.ledform{grid-template-columns:1fr}}
.ledform .lf-l,.ledform .lf-r{display:flex;flex-direction:column;gap:12px;min-width:0}
.lf-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;flex:0 0 auto;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--field);padding:9px 20px;font-weight:800;cursor:pointer;color:var(--muted);font-size:15px;flex:1 1 0;min-width:96px;white-space:nowrap}
.seg button.on.in{background:var(--green-soft);color:var(--green)}
.seg button.on.out{background:var(--red-soft);color:var(--red)}

/* ---------- 잔액 막대 ---------- */
.vault{display:grid;grid-template-columns:minmax(230px,1fr) 2fr;gap:24px;align-items:center}
@media (max-width:760px){.vault{grid-template-columns:1fr}}
.vault .lbl{color:var(--muted);font-size:13px}
.vault .val{font-size:42px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.vault .val small{font-size:15px;color:var(--muted);font-weight:500;margin-left:6px}
.vault .sub2{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.legend div{display:flex;flex-direction:column;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.legend .k{font-size:12px;color:var(--muted)}
.legend .v{font-size:17px;font-weight:700}
.prog{height:10px;border-radius:999px;background:var(--field);border:1px solid var(--line2);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--coin);width:0}

/* ---------- 표 ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{width:100%;border-collapse:collapse;min-width:620px}
.tbl th,.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{background:#101820;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;border-bottom:2px solid var(--line2)}
.tbl tbody tr:nth-child(even) td{background:rgba(255,255,255,.028)}
.tbl tbody tr:hover td{background:rgba(255,255,255,.06)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl tfoot td{background:var(--head);font-weight:800;border-top:2px solid var(--line2);border-bottom:0}
.tbl tr.off td{opacity:.45}
/* 고정 레이아웃: 값이 바뀌어도 열 너비가 변하지 않음 */
table.tbl.fixed{table-layout:fixed;width:100%;min-width:0}
.fixed th,.fixed td{overflow:hidden;text-overflow:ellipsis}
.fixed td.wrap{white-space:normal;overflow-wrap:anywhere;text-overflow:clip}
.fixed td.act{text-align:right;padding-left:6px;padding-right:8px}
.fixed td.act .btn{margin-left:4px}
table.dist{table-layout:fixed;width:100%}
.dist th,.dist td{overflow:hidden;text-overflow:ellipsis}
.dist tbody td{height:58px;padding-top:4px;padding-bottom:4px}
.dist .mi{display:block;position:relative}
.dist .mi input{width:100%}
.dist .mfmt{position:absolute;left:0;right:0;top:100%;margin-top:1px;line-height:1;font-size:10.5px;min-height:0}
.dist input[type=number]{width:100%}
.rankb{font-size:11px;color:var(--coin);margin-right:5px}
.mat td.cellp{cursor:pointer;font-weight:600}
.mat td.cellp.paid{color:var(--green)}
.mat td.cellp.paid::before{content:"✓ ";font-size:11px}
.mat td.cellp.unpaid{color:var(--red);background:var(--red-soft)!important}
.mat td:first-child,.mat th:first-child{position:sticky;left:0;background:var(--panel2);z-index:1;font-weight:700}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:16px;align-items:start}
.rowsel td{cursor:pointer}
.rowsel tr.sel td{background:var(--blue-soft)!important}

/* ---------- 분배 Rule ---------- */
.comp{border:1px solid var(--line);border-left:4px solid var(--cc,var(--line2));border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--panel2)}
.comp.t-base{--cc:var(--blue)} .comp.t-equal{--cc:var(--teal)} .comp.t-perCount{--cc:var(--green)} .comp.t-rank{--cc:var(--coin)} .comp.t-bonus{--cc:var(--purple)}
.comp.dis{opacity:.5}
.comp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.comp-h input[type=text]{width:200px;font-weight:700}
.comp-b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--muted)}
.comp-b input[type=number]{width:90px}
.comp-b .mi input{width:130px}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.ro{padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font-weight:800;font-size:16px;min-height:36px}
.sumbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 0}
.sumbox div{display:flex;flex-direction:column;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.sumbox .k{font-size:12px;color:var(--muted)} .sumbox .v{font-size:17px;font-weight:700}
details.hist{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;background:var(--panel2);overflow:hidden}
details.hist>summary{cursor:pointer;padding:11px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:700;background:var(--head);border-left:4px solid var(--coin)}
details.hist .inner{padding:14px}
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--field);border:1px solid var(--line2);margin:0 0 12px}
.stack i{display:block;height:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* ---------- 레이드 ---------- */
.raidgrid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
@media (max-width:1120px){.raidgrid{grid-template-columns:1fr}.raidside{order:-1;position:static!important;max-height:none!important}}
.raidside{position:sticky;top:116px;max-height:calc(100vh - 130px);overflow:auto;border-radius:10px}
.raidside .card{margin-bottom:0}
.stocklist{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;margin:12px 0}
.stockitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;background:var(--field);font-weight:700}
.stockitem:hover{border-color:var(--coin)}
.stockitem.sel{border-color:var(--coin);background:var(--coin-soft);color:var(--coin)}
.stockitem .x,.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0 4px}
.stockitem .x:hover,.x:hover{color:var(--red)}
.sellform{border:1px solid var(--coin);border-radius:10px;padding:12px;background:var(--coin-soft);display:flex;flex-direction:column;gap:10px}
.stockadd{display:flex;gap:6px}
.stockadd .sn{flex:1;min-width:0}
.stockadd .sq{width:64px}
.eq{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.eqb{flex:1 1 170px;border-radius:10px;padding:12px 16px;border:1px solid var(--line2);background:var(--panel2)}
.eqb span{display:block;font-size:12px;color:var(--muted)}
.eqb b{font-size:21px}
.eqb.in{border-color:var(--green);background:var(--green-soft)} .eqb.in b{color:var(--green)}
.eqb.out{border-color:var(--red);background:var(--red-soft)} .eqb.out b{color:var(--red)}
.eqb.net{border-color:var(--teal);background:var(--teal-soft)}
.op{align-self:center;font-size:26px;font-weight:800;color:var(--muted)}
.expadd{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:8px;margin-top:12px;align-items:start}
@media (max-width:820px){.expadd{grid-template-columns:1fr 1fr}}
.expadd input{width:100%}
.expadd .mi{display:flex;width:100%}

.stockitem{cursor:default}
.stockitem:hover{border-color:var(--line2)}
.lotadd{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lotadd .ln{width:240px;max-width:100%} .lotadd .lq{width:72px}
/* 빠른 등록(담기) */
.qreg{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.qreg .qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.qreg .seg{margin:0 0 10px}
.qitems{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto;padding:2px}
.qitems .chip{cursor:pointer;font-size:13px;padding:5px 12px;font-weight:700;border-width:1.5px;transition:filter .12s,transform .12s}
.qitems .chip:hover{filter:brightness(1.25);transform:translateY(-1px)}
.qitems .chip.picked{box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
.qitems .chip b{margin-left:6px;padding:0 6px;border-radius:999px;background:currentColor}
.qitems .chip b span{color:var(--bg)}
.qitems .chip small{margin-left:6px;color:inherit;opacity:.85;font-weight:700;font-size:12px}
.qitems .chip.lockd{opacity:.8}
.seg .cdot2{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.est{color:var(--muted);font-style:italic}
.qcart{margin-top:12px;border-top:1px dashed var(--line2);padding-top:10px}
.qcart .qrow{display:grid;grid-template-columns:minmax(120px,1fr) auto auto;gap:8px;align-items:center;padding:4px 0}
.qcart .qty{display:inline-flex;align-items:center;gap:4px}
.qcart .qty input{width:58px;text-align:center}
.qcart .qfoot{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.catchip{font-size:12px}
/* 공성전 출석 */
.tab .cnt.live{background:#ff6b6b;color:#fff}
/* 구매자별 수량 */
.bqbox{margin-top:10px;padding:12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2)}
.bqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.bqi{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.bqi span:first-child{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bqi input{width:64px;text-align:center}
.bqsum{margin-top:8px;font-size:13px}
/* 분배 작업 시작 */
.workbar{scroll-margin-top:160px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 20px;padding:14px 16px;border:2px dashed var(--line2);border-radius:12px}
.workbar.on{border-style:solid;border-color:var(--coin);background:rgba(244,199,107,.06)}
.workbtn{font-size:16px;font-weight:800;padding:12px 24px;border:2px solid var(--coin);color:var(--coin);border-radius:10px;background:transparent}
.workbtn:hover{background:rgba(244,199,107,.12)}
.workbtn.on{background:var(--coin);color:#1a1406}

<script>
(function(){
'use strict';

/* =====================================================================
   0. 저장소(Repo)
   - 지금은 브라우저 localStorage 에 JSON 으로 저장합니다.
   - 나중에 Firebase 로 옮길 때는 이 Repo 객체의 load()/save() 만 바꾸면 됩니다.
   ===================================================================== */
const SCHEMA = 4;   // 4 = 레이드: 아이템 등록→판매 입력→일괄 반영, 재고 이월, 현금 관리 (이전 버전은 열 때 자동 변환)
const KEY = 'r2_guild_fund_v1';
const APP_VER = '2026.11.11-a';   // 화면 맨 위에 표시 — 휴대폰 등에서 최신 파일인지 확인용
/* ★ Firebase 연동 설정 — 가이드(firebase_setup_guide.md)대로 만든 웹앱 설정값을 여기에 붙여넣으세요.
   비워 두면(null) 지금처럼 이 브라우저에만 저장됩니다. (로그인/계정은 사용하지 않습니다)
   예) const FIREBASE_CONFIG = { apiKey:"...", authDomain:"...", projectId:"...", appId:"..." }; */
const FIREBASE_CONFIG = {
  "apiKey": "AIzaSyB596GHLV4Zzl0kNp-Duc2FGeFWTWTORNI",
  "authDomain": "jins-projectm.firebaseapp.com",
  "projectId": "jins-projectm",
  "storageBucket": "jins-projectm.firebasestorage.app",
  "messagingSenderId": "608147968494",
  "appId": "1:608147968494:web:bea3aef776fda56c57feff"
};
const memStore = {data:null};
const Repo = {
  async load(){
    try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return memStore.data; }
  },
  async save(data){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch(e){ memStore.data = JSON.parse(JSON.stringify(data)); return false; }
  }
};

/* =====================================================================
   1. 유틸  (모든 금액은 '만 실버' 정수: 1억 = 10,000)
   ===================================================================== */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const num = v=>{ const x=parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(x)?x:0; };
const r6 = n=>Math.round((+n||0)*1e6)/1e6;
const r2 = n=>Math.round((+n||0)*100)/100;
const clamp = (n,a,b)=>Math.min(b,Math.max(a,n));
const floorTo = (n,u)=>{ u=u>0?u:1; return r6(Math.floor(n/u+1e-9)*u); };
const fmtN = n=>r2(n).toLocaleString('ko-KR',{maximumFractionDigits:2});
const fmtM = n=>{   // 500억 / 1억 2,345만 / 5,000만
  n=Math.round(+n||0); if(n===0) return '0';
  const neg=n<0; n=Math.abs(n);
  const eok=Math.floor(n/10000), man=n%10000, L=x=>x.toLocaleString('ko-KR');
  const s = eok&&man ? L(eok)+'억 '+L(man)+'만' : eok ? L(eok)+'억' : L(man)+'만';
  return (neg?'-':'')+s;
};
const fmtAxis = n=>{ const a=Math.abs(n); const s=a>=10000?(Math.round(a/1000)/10).toLocaleString('ko-KR')+'억':a.toLocaleString('ko-KR')+'만'; return (n<0?'-':'')+s; };
const niceMax = v=>{ v=Math.max(1,v); const p=Math.pow(10,Math.floor(Math.log10(v))), f=v/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; };
const pad = n=>String(n).padStart(2,'0');
const today = ()=>{ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const DOW = ['일','월','화','수','목','금','토'];
const fmtDate = s=>{
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s||'')) return s||'-';
  const [y,m,d]=s.split('-').map(Number); return s+'('+DOW[new Date(y,m-1,d).getDay()]+')';
};
const fmtInputVal = v=>{ const d=String(v==null?'':v).replace(/[^\d]/g,''); return d===''?'':Number(d).toLocaleString('ko-KR'); };
// 금액 입력칸: 천 단위 쉼표 자동 + 아래에 "= 5억 0만" 표시
const moneyIn = (attrs,val,cls)=>'<span class="mi"><input type="text" inputmode="numeric" autocomplete="off" data-money '+(cls?'class="'+cls+'" ':'')+attrs+' value="'+(val===''||val==null?'':esc(fmtInputVal(Math.max(0,Math.round(num(val))))))+'"><small class="mfmt"></small></span>';
const negc = n=>Math.round(+n||0)<0?' neg':'';   // 잔액이 마이너스면 빨간색
const fmtWon = n=>{   // 1억 2,345만 6,789원
  n=Math.round(+n||0); const neg=n<0; n=Math.abs(n);
  const eok=Math.floor(n/1e8), man=Math.floor((n%1e8)/1e4), won=n%1e4, L=x=>x.toLocaleString('ko-KR'); let s='';
  if(eok) s+=L(eok)+'억'; if(man) s+=(s?' ':'')+L(man)+'만'; if(won) s+=(s?' ':'')+L(won); if(!s) s='0';
  return (neg?'-':'')+s+'원';
};
const wonIn = (attrs,val,cls)=>moneyIn(attrs+' data-won',val,cls);
function moneyHint(el){
  const mi=el.closest('.mi'); if(!mi) return; const h=mi.querySelector('.mfmt'); if(!h) return;
  const n=num(el.value); h.textContent=n?('= '+(el.hasAttribute('data-won')?fmtWon(n):fmtM(n))):'';
}
function formatMoneyInput(el){
  const pos=el.selectionStart==null?el.value.length:el.selectionStart;
  const before=el.value.slice(0,pos).replace(/\D/g,'').length;
  const f=fmtInputVal(el.value); el.value=f;
  let i=0,d=0; while(i<f.length&&d<before){ if(/\d/.test(f[i])) d++; i++; }
  try{ el.setSelectionRange(i,i); }catch(e){}
}

/* =====================================================================
   2. 기본 데이터 / 정규화 / 이전 버전 변환
   ===================================================================== */
const PRESET_INCOME = ['롱쉴드','거친','다마','어쎄메일','5어쎄글러브','고줌','향태반','잡무기','잡방어구','잡주문서','불강 셋트(2)'];
// 판매 아이템 분류
// 판매 아이템 분류 (판매 아이템 등록 탭에서 추가·이름 변경·삭제·순서·색상 변경 가능, 'misc'(잡템)은 삭제 불가)
const CAT_COLORS=['#ff6b6b','#ff9f7a','#f4c76b','#5ad19a','#4fd1c5','#5aa9ff','#c9a0ff','#ff6b8a','#b8c1ce'];
const DEFAULT_CATS=[{id:'weapon',name:'무기',color:'#ff6b6b'},{id:'armor',name:'방어구',color:'#5aa9ff'},{id:'acc',name:'악세사리',color:'#c9a0ff'},{id:'scroll',name:'주문서',color:'#f4c76b'},{id:'misc',name:'잡템',color:'#b8c1ce'}];
const itemCats=()=>(typeof S!=='undefined'&&S&&S.settings&&Array.isArray(S.settings.itemCats)&&S.settings.itemCats.length)?S.settings.itemCats:DEFAULT_CATS;
const catOk=(c,list)=>(list||itemCats()).some(x=>x.id===c)?c:'misc';
const catOf=c=>itemCats().find(x=>x.id===c)||itemCats().find(x=>x.id==='misc')||DEFAULT_CATS[4];
const catName=c=>catOf(c).name;
const catStyle=col=>'color:'+col+';border-color:'+col+';background:'+col+'22';
const catChip=c=>{ const x=catOf(c); return '<span class="chip catchip" style="'+catStyle(x.color)+'">'+esc(x.name)+'</span>'; };
const catOpts=sel=>itemCats().map(c=>'<option value="'+esc(c.id)+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>').join('');
function normCats(arr){
  const out=[], seenId=new Set(), seenName=new Set();
  (Array.isArray(arr)?arr:DEFAULT_CATS).forEach(c=>{ if(!c) return; const id=String(c.id||'').trim()||uid(), name=normName(c.name); if(!name||seenId.has(id)||seenName.has(name.toLowerCase())) return;
    seenId.add(id); seenName.add(name.toLowerCase()); out.push({id,name,color:/^#[0-9a-f]{6}$/i.test(c.color||'')?c.color:CAT_COLORS[out.length%CAT_COLORS.length]}); });
  if(!seenId.has('misc')) out.push({id:'misc',name:seenName.has('잡템')?'기타':'잡템',color:'#b8c1ce'});
  return out;
}
const normName=n=>String(n==null?'':n).trim().replace(/\s+/g,' ');
// 처음 목록을 만들 때만 이름으로 분류를 추정 (이후 새 아이템은 '잡템'으로 자동 등록)
function guessCat(n){
  if(/주문서|스크롤|줌$|줌\b|강화/.test(n)) return 'scroll';
  if(/반지|목걸이|귀걸이|팔찌|벨트|아뮬렛|링$|이어링|악세|장신구/.test(n)) return 'acc';
  if(/갑옷|메일|쉴드|방패|투구|헬름|장갑|글러브|부츠|신발|망토|클로크|로브|방어구|각반|티셔츠|셔츠/.test(n)) return 'armor';
  if(/무기|검$|대검|단검|도끼|활$|석궁|창$|지팡이|스태프|크로우|블레이드|보우|너클|이도류|양손|한손/.test(n)) return 'weapon';
  return 'misc';
}
// 판매 기록에서 아이템별 최근 판매가(1개당) 찾기 → 기본 가격 초기값
function saleHistory(o){
  const h=new Map(), put=(n,price,date)=>{ n=normName(n).toLowerCase(); price=Math.round(num(price)); if(!n||!(price>0)) return; const c=h.get(n); if(!c||(date||'')>=(c.date||'')) h.set(n,{price,date:date||''}); };
  (o.raids||[]).forEach(r=>(r.lots||[]).forEach(l=>{ if(l.state==='sold') put(l.name,l.price,l.soldDate||r.date); }));
  (o.stockSales||[]).forEach(x=>{ if(!x.bundle) put(x.name,x.price,x.date); });   // 묶음 가격은 개별 시세가 아님
  return h;
}
function seedCatalog(o){
  const map=new Map();
  const add=(n,date)=>{ n=normName(n); if(!n) return; const k=n.toLowerCase(); let it=map.get(k);
    if(!it){ it={id:uid(),name:n,cat:guessCat(n),uses:0,last:''}; map.set(k,it); }
    if(date!==undefined){ it.uses++; if(date&&date>it.last) it.last=date; } };
  (((o.settings||{}).itemPresets||{}).income||[]).forEach(n=>add(n));
  (o.raids||[]).forEach(r=>(r.lots||[]).forEach(l=>add(l.name,r.date||'')));
  (o.stock||[]).forEach(x=>add(x.name)); (o.stockSales||[]).forEach(x=>{ if(x.bundle) (x.lines||[]).forEach(l=>add(l.name)); else add(x.name); });
  const hist=saleHistory(o);
  map.forEach((it,k)=>{ const sh=hist.get(k); it.price=sh?sh.price:0; it.soldPrice=sh?sh.price:0; it.soldAt=sh?sh.date:''; it.prevPrice=0; });
  return Array.from(map.values());
}

// 레이드의 판매/지출 내역 → 길자금 입출금 내역(자동 기록)
function buildRaidEntries(r,members){
  const out=[];
  (r.items||[]).forEach(it=>(it.sales||[]).forEach(s=>{
    const isExp=it.type==='expense';
    let by=s.buyer||''; if(s.buyerId&&members){ const m=members.find(x=>x.id===s.buyerId); if(m) by=m.name; }
    out.push({id:'rs_'+s.id,date:s.date||r.date,type:isExp?'expense':'income',category:isExp?'레이드 지출':'레이드 판매',
      amount:Math.round(num(s.price)),memo:(r.title||'레이드')+' · '+it.name+(by?(isExp?' ('+by+')':' → '+by):''),
      ref:{kind:'raid',id:r.id,saleId:s.id}});
  }));
  return out;
}
function migrateV2(d){      // 백만 실버 → 만 실버 (×100)
  const x=n=>Math.round((+n||0)*100);
  if(d.settings){ if(d.settings.distThreshold!=null) d.settings.distThreshold=x(d.settings.distThreshold); d.settings.unit='만 실버'; }
  if(d.rule){
    if(d.rule.roundUnit!=null) d.rule.roundUnit=Math.max(1,x(d.rule.roundUnit));
    (d.rule.components||[]).forEach(c=>{ if(c.type==='base') c.amount=x(c.amount); });
  }
  (d.ledger||[]).forEach(e=>{ e.amount=x(e.amount); e.distPortion=x(e.distPortion); e.distUsed=x(e.distUsed); });
  (d.raids||[]).forEach(r=>{
    (r.items||[]).forEach(i=>(i.sales||[]).forEach(s=>{ s.price=x(s.price); }));
    if(r.snap){ r.snap.net=x(r.snap.net); r.snap.guildAmt=x(r.snap.guildAmt); r.snap.distAmt=x(r.snap.distAmt); }
  });
  (d.distributions||[]).forEach(dd=>{
    dd.poolAmount=x(dd.poolAmount);
    if(dd.unitSnap!=null) dd.unitSnap=Math.max(1,x(dd.unitSnap));
    (dd.compsSnap||[]).forEach(c=>{ if(c.type==='base') c.amount=x(c.amount); });
    if(dd.summary) ['totalPayout','poolUsed','overage','leftover'].forEach(k=>{ dd.summary[k]=x(dd.summary[k]); });
    (dd.results||[]).forEach(r=>{ r.total=x(r.total); Object.keys(r.parts||{}).forEach(k=>{ r.parts[k]=x(r.parts[k]); }); });
  });
  d.schemaVersion=2;
}
function migrateV3(d){      // 분배 대기금 제거 + 레이드: 판매 내역을 길자금에 건별 자동 기록
  d.raids=d.raids||[]; d.ledger=d.ledger||[];
  d.ledger=d.ledger.filter(e=>!(e.ref&&e.ref.kind==='raid'&&!e.ref.saleId));
  d.ledger.forEach(e=>{ delete e.distPortion; delete e.distUsed; });
  d.raids.forEach(r=>{
    const dt=(r.snap&&r.snap.incomeDate)||r.date;
    r.items=(r.items||[]).filter(i=>(i.sales||[]).length);
    r.items.forEach(i=>i.sales.forEach(s=>{ if(!s.id) s.id=uid(); if(!s.date) s.date=dt; }));
    r.stock=r.stock||[];
    delete r.status; delete r.snap; delete r.ledgerId; delete r.distPct;
    buildRaidEntries(r,d.members).forEach(e=>d.ledger.push(e));
  });
  if(d.rule){ delete d.rule.guildPct; delete d.rule.distPct; }
  d.schemaVersion=3;
}
function migrateV4(d){      // 레이드 건별 자동기록 → 레이드당 1건 / 재고 이월 / 현금·뽑기 기록 추가
  d.stock=d.stock||[]; d.cash=d.cash||[]; d.draws=d.draws||[]; d.ledger=d.ledger||[];
  (d.raids||[]).forEach(r=>{
    (r.stock||[]).forEach(x=>d.stock.push({id:x.id||uid(),name:x.name,from:r.id,fromTitle:r.title||'',date:r.date}));
    d.ledger=d.ledger.filter(e=>!(e.ref&&e.ref.kind==='raid'&&e.ref.id===r.id));
    const lots=[], expenses=[]; let last=r.date, inc=0, exp=0;
    (r.items||[]).forEach(it=>(it.sales||[]).forEach(s=>{
      const price=Math.round(num(s.price)); if(s.date&&s.date>last) last=s.date;
      if(it.type==='expense'){ expenses.push({id:s.id||uid(),name:it.name,price,note:s.buyer||'',date:s.date||r.date}); exp+=price; }
      else{
        const b=s.buyerId&&s.buyerId!=='__ext'?{id:s.buyerId,name:s.buyer||''}:{id:'__ext',name:s.buyer||'외부/기타'};
        lots.push({id:s.id||uid(),name:it.name,qty:1,state:'sold',price,buyers:[b],bidders:[],soldDate:s.date||r.date}); inc+=price;
      }
    }));
    r.lots=lots; r.expenses=expenses; delete r.items; delete r.stock;
    const net=inc-exp;
    if(lots.length||expenses.length){
      r.status='completed'; const lid=uid(); r.ledgerId=lid; r.snap={date:last,net,inc,exp};
      if(net!==0) d.ledger.push({id:lid,date:last,type:net>0?'income':'expense',category:'레이드 정산',amount:Math.abs(net),
        memo:(r.title||'레이드')+' · 판매 수입 '+fmtM(inc)+' − 지출 '+fmtM(exp),ref:{kind:'raid',id:r.id}});
    } else r.status='draft';
  });
  d.schemaVersion=4;
}
function migrate(d){
  if((d.schemaVersion||1)<2) migrateV2(d);
  if((d.schemaVersion||2)<3) migrateV3(d);
  if((d.schemaVersion||3)<4) migrateV4(d);
  return d;
}
function normalize(d){

  o.settings = Object.assign({}, D.settings, d.settings||{});
  o.settings.unit='만 실버';
  o.settings.hammerUrl=o.settings.hammerUrl||D.settings.hammerUrl;
  o.settings.itemPresets = Object.assign({}, D.settings.itemPresets, (d.settings&&d.settings.itemPresets)||{});
  o.rule = Object.assign({}, D.rule, d.rule||{});
  o.rule.components = Array.isArray(o.rule.components) ? o.rule.components : D.rule.components;
  o.rule.components.forEach(c=>{ if(!c.id) c.id=uid(); if(c.enabled===undefined) c.enabled=true; if(c.type==='rank'&&!Array.isArray(c.tiers)) c.tiers=[50,30,20]; });
  if(!bonusInit && !o.rule.components.some(c=>c.type==='bonus')) o.rule.components.unshift({id:uid(),type:'bonus',name:'포상(수고비)',enabled:true});
  o.rule.bonusInit=true;
  if(!ratioInit){   // 분배 비율을 길드자금 20% · 분배 50% · 기본급 30%로 재구성 (포상 항목은 유지)
    o.rule.components=o.rule.components.filter(c=>c.type==='bonus').concat(makeComps(DEFAULT_RATIOS()));
  }
  o.rule.ratioInit=true;
  { const pcComp=o.rule.components.find(c=>c.type==='perCount'&&c.enabled)||o.rule.components.find(c=>c.type==='perCount');
    o.rule.components.forEach(c=>{ if(c.type==='bonus'&&c.from===undefined) c.from=pcComp?pcComp.id:'pool'; }); }   // 앞으로 포상은 '분배' 몫에서 차감 (지난 분배 기록은 그대로)
  ['members','ledger','raids','distributions','stock','stockSales','cash','draws','notices','siege'].forEach(k=>{ o[k]=Array.isArray(d[k])?d[k]:(d[k]===undefined&&k==='members'?D.members:[]); });
  o.members.forEach(m=>{ if(!CLASSES.includes(m.cls)) m.cls=''; delete m.joinedAt; });
  o.notices.forEach(n=>{ n.type=n.type==='meeting'?'meeting':'notice'; n.status=n.status==='archived'?'archived':'active'; n.title=n.title||''; n.body=n.body||''; n.date=n.date||today(); n.attendees=Array.isArray(n.attendees)?n.attendees:[]; if(!Array.isArray(n.attendeeNames)||n.attendeeNames.length!==n.attendees.length) n.attendeeNames=n.attendees.map(id=>{ const m=o.members.find(x=>x.id===id); return m?m.name:''; }); n.pinned=!!n.pinned; });
  o.raids.forEach(r=>{ r.lots=Array.isArray(r.lots)?r.lots:[]; r.expenses=Array.isArray(r.expenses)?r.expenses:[]; r.status=r.status==='completed'?'completed':'draft';
    r.lots.forEach(l=>{ l.buyers=Array.isArray(l.buyers)?l.buyers:[]; l.bidders=Array.isArray(l.bidders)?l.bidders:[]; l.qty=Math.max(1,Math.round(num(l.qty))||1); }); });
  o.distributions.forEach(x=>{ x.rows=Array.isArray(x.rows)?x.rows:[]; });
  // 판매 아이템 목록 (없으면 기본 품목 + 지금까지 등록된 아이템으로 처음 한 번 만듦)
  // 공성전 출석: 주차(일요일 날짜)·길드원별 1건
  { const seen=new Set(); o.siege=o.siege.filter(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.week||'')&&x.memberId&&(x.status==='in'||x.status==='out')).filter(x=>{ const k=x.week+'|'+x.memberId; if(seen.has(k)) return false; seen.add(k); return true; })
      .map(x=>({id:x.week.replace(/-/g,'')+'_'+x.memberId,week:x.week,memberId:x.memberId,name:String(x.name||''),status:x.status,reason:String(x.reason||'').slice(0,200),at:x.at||'',by:String(x.by||'').slice(0,30),pre:!!x.pre})); }

  if(Array.isArray(cat0)){ const seen=new Set(); o.settings.itemCatalog=cat0.filter(x=>{ const n=normName(x&&x.name).toLowerCase(); if(!n||seen.has(n)) return false; seen.add(n); return true; })
      .map(x=>({id:x.id||uid(),name:normName(x.name),cat:catOk(x.cat,o.settings.itemCats),uses:Math.max(0,Math.round(num(x.uses))),last:x.last||'',
        price:Math.max(0,Math.round(num(x.price))),soldPrice:Math.max(0,Math.round(num(x.soldPrice))),soldAt:x.soldAt||'',prevPrice:Math.max(0,Math.round(num(x.prevPrice))),auto:!!x.auto,_np:x.price===undefined}));
    // 기본 가격이 아직 없던 목록(이전 버전)은 판매 기록의 최근 판매가로 채움
    if(o.settings.itemCatalog.some(x=>x._np)){ const hist=saleHistory(o); o.settings.itemCatalog.forEach(x=>{ if(x._np){ const sh=hist.get(x.name.toLowerCase()); if(sh){ x.price=sh.price; x.soldPrice=sh.price; x.soldAt=sh.date; } } }); }

  o.settings.itemHidden=Array.isArray(o.settings.itemHidden)?o.settings.itemHidden.map(n=>normName(n).toLowerCase()).filter(Boolean):[];
  // 레이드·재고에 있는데 목록에 빠진 아이템 보충 (사용자가 직접 삭제한 이름은 제외) → '잡템 · 정리 필요'로 추가
  { const have=new Set(o.settings.itemCatalog.map(x=>x.name.toLowerCase())), hid=new Set(o.settings.itemHidden), hist=saleHistory(o);

      o.settings.itemCatalog.push({id:uid(),name:n,cat:'misc',uses:0,last:'',price:sh?sh.price:0,soldPrice:sh?sh.price:0,soldAt:sh?sh.date:'',prevPrice:0,auto:true}); };
    o.raids.forEach(r=>(r.lots||[]).forEach(l=>fill(l.name))); o.stock.forEach(x=>fill(x.name)); o.stockSales.forEach(x=>{ if(x.bundle) (x.lines||[]).forEach(l=>fill(l.name)); else fill(x.name); }); }
  return o;
}

   3. 계산 (화면과 분리된 순수 함수)

let S = null;
function pools(){
  let inc=0, exp=0;
  for(const e of S.ledger){ if(e.type==='income') inc+=num(e.amount); else exp+=num(e.amount); }
  return {inc:Math.round(inc),exp:Math.round(exp),bal:Math.round(inc-exp)};
}
function ledgerRows(){
  const rows=S.ledger.map((e,i)=>({e,i})).sort((a,b)=>a.e.date===b.e.date?a.i-b.i:(a.e.date<b.e.date?-1:1));
  let bal=0; rows.forEach(r=>{ bal+= r.e.type==='income'?num(r.e.amount):-num(r.e.amount); r.bal=Math.round(bal); });
  return rows;
}
// 월별 수입/지출/월말 잔액 (오래된 달 → 최근 달)
function monthlyData(){
  const map={};

/* 분배 계산
   ① 포상(수고비)과 기본급을 먼저 뺀다 → ② 남은 금액에 각 항목의 %를 적용한다.
   지급 단위(roundUnit): 개인 지급액을 이 단위로 내림. 남은 금액은 길자금에 그대로 남음. */
function calcDist(pool, rule, rows){
  const unit = rule.roundUnit>0 ? rule.roundUnit : 1;
  const comps = rule.components.filter(c=>c.enabled);
  const out = rows.map(r=>({memberId:r.memberId, join:!!r.join, count:num(r.count), bonus:r.bonus||{}, parts:{}, total:0}));
  const act = out.filter(o=>o.join), n = act.length;
  const errors=[], warns=[], info={};
  let baseTotal=0, bonusTotal=0;
  // 포상 차감 위치: 'pool'=분배 대상 전체에서 먼저 / 비율 항목 id=그 항목의 몫에서 차감
  const ratioComps=comps.filter(c=>!isAmt(c));
  const fromOf=c=>{ let f=c.from; if(f===undefined){ const pc=ratioComps.find(x=>x.type==='perCount'); f=pc?pc.id:'pool'; }
    if(f!=='pool'&&!ratioComps.some(x=>x.id===f)){ warns.push('"'+c.name+'"의 차감 위치 항목이 없어(사용 안 함/삭제) 분배 대상 전체에서 먼저 차감합니다.'); f='pool'; } return f; };
  const bonusBy={}, bonusFrom={};
  comps.forEach(c=>{
    out.forEach(o=>{ o.parts[c.id]=0; });
    if(c.type==='base'){ const a=num(c.amount); act.forEach(o=>{ o.parts[c.id]=floorTo(a,unit); }); baseTotal+=a*n; }
    else if(c.type==='bonus'){ let sum=0; out.forEach(o=>{ const v=Math.max(0,Math.round(num(o.bonus[c.id]))); o.parts[c.id]=v; sum+=v; }); bonusTotal+=sum; const f=fromOf(c); bonusFrom[c.id]=f; bonusBy[f]=(bonusBy[f]||0)+sum; }
  });
  const bonusPool=bonusBy.pool||0;
  let R = pool - bonusPool - baseTotal;
  if(R < -1e-9){
    errors.push((bonusPool?'포상('+fmtM(bonusPool)+')과 고정 기본급('+fmtM(baseTotal)+') 합계가':'고정 기본급 합계('+fmtM(baseTotal)+')가')+' 분배 대상 금액('+fmtM(pool)+')보다 큽니다.'); R=0;
  }
  let pctSum=0, retained=0, ratioCnt=0;
  comps.filter(c=>!isAmt(c)).forEach(c=>{
    const pct=num(c.pct); pctSum+=pct; ratioCnt++;
    const gross=R*pct/100, ded=bonusBy[c.id]||0; let pc=gross-ded; const inf={pool:pc}; info[c.id]=inf;
    if(ded){ inf.gross=gross; inf.bonusOut=ded; if(pc< -1e-9){ errors.push('포상 합계('+fmtM(ded)+')가 "'+c.name+'" 몫('+fmtM(gross)+')보다 큽니다.'); pc=0; inf.pool=0; } }
    if(c.type==='guild'){ inf.retained=pc; retained+=pc; }
    else if(c.type==='equal'){
      if(n>0){ const v=floorTo(pc/n,unit); act.forEach(o=>{ o.parts[c.id]=v; }); }
    } else if(c.type==='perCount'){
      const tc=act.reduce((a,o)=>a+o.count,0); inf.totalCount=tc;
      if(tc>0){ const per=pc/tc; inf.per=per; act.forEach(o=>{ o.parts[c.id]=floorTo(o.count*per,unit); }); }
      else if(pct>0){ warns.push('"'+c.name+'": 모니터링 횟수 합계가 0이라 지급되지 않습니다.'); }
    } else if(c.type==='rank'){
      const tiers=(c.tiers||[]).map(num);
      if(tiers.reduce((a,b)=>a+b,0)>100.0001) errors.push('"'+c.name+'": 순위별 비율 합계가 100%를 넘습니다.');
      const cnts=Array.from(new Set(act.filter(o=>o.count>0).map(o=>o.count))).sort((a,b)=>b-a);
      inf.tiers=[];
      tiers.forEach((tp,i)=>{
        const cnt=cnts[i]; const tierPool=pc*tp/100;
        const ms = cnt===undefined ? [] : act.filter(o=>o.count===cnt);
        const each = ms.length ? (c.tie==='full' ? tierPool : tierPool/ms.length) : 0;
        ms.forEach(o=>{ o.parts[c.id]=floorTo(each,unit); });
        inf.tiers.push({rank:i+1,count:cnt,people:ms.length,each:each,tierPool:tierPool});
      });
    }
  });
  if(!ratioCnt) errors.push('분배 비율 항목이 없습니다. 합계가 100%가 되도록 추가하세요.');
  else if(Math.abs(pctSum-100)>0.0001) errors.push('분배 비율 합계가 100%가 아닙니다 (현재 '+r2(pctSum)+'%).');
  if(n===0 && bonusTotal===0) errors.push('참여자가 없습니다.');
  out.forEach(o=>{ o.total = r6(comps.reduce((a,c)=>a+(o.parts[c.id]||0),0)); });
  const totalPayout = r6(out.reduce((a,o)=>a+o.total,0));
  return {persons:out,n,totalPayout,bonusTotal,retained:Math.round(retained),
    overage:Math.round(Math.max(0,totalPayout-pool)), leftover:Math.round(Math.max(0,pool-totalPayout)),
    pctSum, baseTotal, remain:R, errors, warns, info, comps, bonusFrom, bonusBy};
}

function sha256(str){
  const rr=(v,n)=>(v>>>n)|(v<<(32-n)), s=unescape(encodeURIComponent(str)), len=s.length*8, m=[];
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  for(let i=0;i<s.length;i++) m[i>>2]=(m[i>>2]|0)|(s.charCodeAt(i)<<(24-(i%4)*8));
  m[len>>5]=(m[len>>5]|0)|(0x80<<(24-len%32)); const last=(((len+64)>>9)<<4)+15; m[last]=len;
  for(let i=0;i<=last;i++) m[i]=m[i]|0;
  const w=new Array(64);
  for(let j=0;j<m.length;j+=16){
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      if(i<16) w[i]=m[j+i]; else{ const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3), s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])|0, S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}

// 전체 자금 흐름: 월별 수입·지출·월말 잔액 꺾은선 (하나의 축 · 마이너스도 표시)
function flowChart(ms){
  const n=ms.length, W=Math.max(920,n*70), H=340, L=74, R=30, T=26, B=62, iw=W-L-R, ih=H-T-B, PAD=56;   // 양 끝 점·금액이 잘리지 않게 여백
  const all=ms.flatMap(m=>[m.inc,m.exp,m.bal]), hi0=Math.max(0,...all), lo0=Math.min(0,...all);
  // 0을 포함하는 깔끔한 눈금 (1·2·2.5·5 단위)
  const niceStep=v=>{ const p=Math.pow(10,Math.floor(Math.log10(v))), m=v/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; };
  const step=niceStep(Math.max(1,(hi0-lo0))/5), lo=Math.floor(lo0/step)*step, hi=Math.max(step,Math.ceil(hi0/step)*step);
  const y=v=>T+ih-((v-lo)/(hi-lo))*ih, x=i=>n===1?L+iw/2:L+PAD+(iw-2*PAD)*i/(n-1);
  let g='';
  for(let v=lo;v<=hi+step/2;v+=step){ const yy=y(v), zero=Math.abs(v)<step/1000;
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" style="stroke:'+(zero?'var(--muted)':'var(--line)')+';stroke-width:'+(zero?1.4:1)+'"/>'+
      '<text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" style="fill:'+(zero?'var(--text)':'var(--muted)')+';font-size:11px">'+(zero?'0':fmtAxis(v))+'</text>'; }
  const line=(key,col,w)=>{ const pts=ms.map((m,i)=>x(i)+','+y(m[key])).join(' ');
    return (n>1?'<polyline points="'+pts+'" style="fill:none;stroke:'+col+';stroke-width:'+w+';stroke-linejoin:round;stroke-linecap:round"/>':''); };
  // 잔액 아래 영역(은은하게)
  const area=n>1?'<polygon points="'+x(0)+','+y(Math.max(lo,0))+' '+ms.map((m,i)=>x(i)+','+y(m.bal)).join(' ')+' '+x(n-1)+','+y(Math.max(lo,0))+'" style="fill:var(--teal);opacity:.10"/>':'';
  const lab=key=>n<=12;
  let dots='', xl='';
  ms.forEach((m,i)=>{
    [['inc','var(--green)','수입',3.5],['exp','var(--red)','지출',3.5],['bal','var(--teal)','월말 잔액',5]].forEach(([k,c,nm,r])=>{
      dots+='<circle cx="'+x(i)+'" cy="'+y(m[k])+'" r="'+r+'" style="fill:'+c+';stroke:var(--bg);stroke-width:1.5"><title>'+m.m+' '+nm+' '+fmtM(m[k])+'</title></circle>'; });
    if(lab()) dots+='<text x="'+x(i)+'" y="'+(m.bal<0?y(m.bal)+20:y(m.bal)-11)+'" text-anchor="middle" style="fill:var(--teal);font-size:12px;font-weight:800;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round">'+fmtM(m.bal)+'</text>';   // 글씨 테두리로 선과 겹쳐도 읽히게
    if(n<=16||i%2===0) xl+='<text x="'+x(i)+'" y="'+(H-14)+'" text-anchor="middle" style="fill:var(--muted);font-size:11px">'+m.m.slice(2)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="월별 수입, 지출, 월말 잔액 추이" style="width:100%;height:auto;min-width:'+Math.max(640,n*60)+'px">'+g+area+
    line('inc','var(--green)',2.2)+line('exp','var(--red)',2.2)+line('bal','var(--teal)',3.4)+dots+xl+'</svg>';
}
function flowCard(ms){
  if(!ms.length) return card('green','전체 자금 흐름','','<div class="empty">입출금 내역이 쌓이면 월별 수입·지출과 잔액 추이가 여기에 나타납니다.</div>');

  const legend='<div class="chips" style="margin-bottom:10px"><span class="chip in">수입</span><span class="chip out">지출</span><span class="chip" style="color:var(--teal);border-color:var(--teal)">월말 잔액</span>'+(ms.length>shown.length?'<span class="small muted" style="align-self:center">최근 24개월만 그래프에 표시</span>':'')+'</div>';
  let t='<p class="small muted" style="margin:14px 0 8px">달을 누르면 아래 입출금 내역이 그 달만 보입니다. 다시 누르면 전체 기간으로 돌아갑니다.</p>'+
    '<div class="tablewrap"><table class="tbl fixed"><colgroup><col style="width:120px"><col><col><col><col></colgroup><thead><tr><th>월</th><th class="num">수입</th><th class="num">지출</th><th class="num">증감</th><th class="num">월말 잔액</th></tr></thead><tbody>';
  ms.slice().reverse().forEach(o=>{
    const d=o.inc-o.exp;
    t+='<tr class="'+(ui.lf.month===o.m?'sel':'')+'" style="cursor:pointer;'+(ui.lf.month===o.m?'outline:2px solid var(--teal);outline-offset:-2px':'')+'" data-act="monthPick" data-m="'+o.m+'"><td><b>'+o.m.replace('-','년 ')+'월</b></td><td class="num pos">'+fmtM(o.inc)+'</td><td class="num neg">'+fmtM(o.exp)+'</td><td class="num '+(d>=0?'pos':'neg')+'">'+(d>0?'+':'')+fmtM(d)+'</td><td class="num"><b>'+fmtM(o.bal)+'</b></td></tr>';
  });
  const ti=ms.reduce((a,o)=>a+o.inc,0), te=ms.reduce((a,o)=>a+o.exp,0);
  t+='</tbody><tfoot><tr><td>전체</td><td class="num pos">'+fmtM(ti)+'</td><td class="num neg">'+fmtM(te)+'</td><td class="num">'+(ti-te>0?'+':'')+fmtM(ti-te)+'</td><td class="num">'+fmtM(ms[ms.length-1].bal)+'</td></tr></tfoot></table></div>';
  return card('green','전체 자금 흐름',legend?'':'',legend+'<div class="tablewrap" style="border:0"><div style="overflow-x:auto">'+flowChart(shown)+'</div></div>'+t);
}

const draftDist=()=>S.distributions.find(d=>d.status==='draft')||null;
const compById=id=>S.rule.components.find(c=>c.id===id);
const activeMembers=()=>S.members.filter(m=>m.status!=='left');
const rowHasInput=r=>!!r&&(num(r.count)>0||Object.values(r.bonus||{}).some(v=>num(v)>0));
function syncDraft(d){
  const active=activeMembers(), ids=new Set(active.map(m=>m.id)), all=new Set(S.members.map(m=>m.id));
  d.parked=(d.parked&&typeof d.parked==='object')?d.parked:{};
  // 비활동이 된 길드원의 입력값은 버리지 않고 보관 (분배 계산에서는 제외)
  d.rows=d.rows.filter(r=>{ if(ids.has(r.memberId)) return true; if(all.has(r.memberId)&&rowHasInput(r)) d.parked[r.memberId]=r; return false; });
  active.forEach(m=>{ if(!d.rows.some(r=>r.memberId===m.id)){ d.rows.push(d.parked[m.id]||{memberId:m.id,join:true,count:0,bonus:{}}); delete d.parked[m.id]; } });
  Object.keys(d.parked).forEach(id=>{ if(!all.has(id)||ids.has(id)) delete d.parked[id]; });
  const order=new Map(S.members.map((m,i)=>[m.id,i]));
  d.rows.sort((a,b)=>order.get(a.memberId)-order.get(b.memberId));
}
function ensureDraft(){   // 분배 탭을 열면 활동 중 전체 길드원 목록이 항상 준비됨
  let d=draftDist();
  if(!d && activeMembers().length){
    d={id:uid(),date:today(),status:'draft',poolAmount:S.settings.distThreshold,rows:[]}; S.distributions.push(d); quiet();
  }
  if(d){ syncDraft(d); d.poolAmount=S.settings.distThreshold; }   // 분배 대상 금액 = 분배 기준 금액 (자동 연동)
  return d;
}

  if(!open) return statusCardHtml()+bar;
  return statusCardHtml()+bar+'<div class="workarea">'+ruleCardHtml()+
    card('coin','분배 기준 대비 잔액','<span class="chip th-chip">-</span>','<span class="th-text" style="font-size:15px;font-weight:700"></span><div class="prog"><i class="th-fill"></i></div>'+
      '<p class="hint" style="margin:12px 0 0">길자금 잔액이 분배 기준 금액보다 적어도 분배할 수 있습니다. 이 경우 분배 후 길자금이 <b class="neg">마이너스</b>가 되며, 이후 레이드 정산 등 수입으로 채워집니다.</p>')+

function updateRuleSum(){
  const ratio=S.rule.components.filter(c=>c.enabled&&!isAmt(c)), sum=ratio.reduce((a,c)=>a+num(c.pct),0), th=Math.round(num(S.settings.distThreshold));
  const bar=$('#ratioBar'); if(bar) bar.innerHTML=ratio.map(c=>'<i style="width:'+(num(c.pct)/Math.max(100,sum)*100)+'%;background:'+(COMP_COLOR[c.type]||'var(--muted)')+'" title="'+esc(c.name)+' '+r2(num(c.pct))+'%"></i>').join('');
  const ok=Math.abs(sum-100)<=0.0001;
  const tot=$('#ratioTotal'); if(tot){ tot.textContent=r2(sum)+'%'+(ok?' ✓':''); tot.className='chip '+(ok?'in':'out'); }
  $$('[data-ramt]').forEach(el=>{ if(el.dataset.ramt==='__sum') el.textContent=fmtM(Math.round(th*sum/100)); else { const c=compById(el.dataset.ramt); el.textContent=c?fmtM(Math.round(th*num(c.pct)/100)):'-'; } });
  const el=$('#ruleSum'); if(!el) return;
  let cls,msg;
  if(!ratio.length){ cls='bad'; msg='분배 비율 항목이 없습니다. 항목을 추가해 합계를 100%로 맞추세요.'; }
  else if(ok){ cls='ok'; msg='분배 비율 합계 100% ✓ — '+ratio.map(c=>esc(c.name)+' '+r2(num(c.pct))+'%').join(' · '); }
  else{ cls='bad'; const d=r2(100-sum); msg='분배 비율 합계 '+r2(sum)+'% — '+(d>0?d+'% 부족':(-d)+'% 초과')+'합니다. 합계가 100%가 되어야 분배를 완료할 수 있습니다.'; }
  el.className='notice '+cls; el.innerHTML=msg;
}

  const pool=Math.round(num(S.settings.distThreshold)); d.poolAmount=pool;

  const cells={}; $$('[data-cell]').forEach(e=>{ cells[e.dataset.cell]=e; });
  const comps=res.comps;
  res.persons.forEach(o=>{
    const row=$('[data-row="'+CSS.escape(o.memberId)+'"]'); if(row) row.classList.toggle('off',!o.join&&!(o.total>0));
    comps.forEach(c=>{
      const el=cells['p:'+o.memberId+':'+c.id]; if(!el) return;
      const v=o.parts[c.id]||0; let html=(o.join||v>0)?fmtM(v):'-';
      if(o.join&&c.type==='rank'&&v>0){ const inf=res.info[c.id]; const t=inf&&inf.tiers&&inf.tiers.find(x=>x.count===o.count&&x.each>0); if(t) html='<span class="rankb">'+t.rank+'등</span>'+html; }
      el.innerHTML=html;
    });
    const te=cells['t:'+o.memberId]; if(te) te.innerHTML='<b>'+((o.join||o.total>0)?fmtM(o.total):'-')+'</b>';
  });
  comps.forEach(c=>{ const el=cells['ct:'+c.id]; if(el) el.textContent=fmtM(res.persons.reduce((a,o)=>a+(o.parts[c.id]||0),0)); });
  if(cells.n) cells.n.textContent='참여 '+res.n+'명';
  if(cells.cc) cells.cc.textContent=fmtN(res.persons.filter(o=>o.join).reduce((a,o)=>a+o.count,0));
  if(cells.tt) cells.tt.textContent=fmtM(res.totalPayout);
  const errs=res.errors.slice(), notes=[];
  if(pool<=0) errs.push('분배 RULE에서 분배 기준 금액을 입력하세요.');
  if(pool>0&&p.bal-res.totalPayout<0) notes.push('⚠ 총 지급액('+fmtM(res.totalPayout)+')이 길자금 잔액('+fmtM(p.bal)+')보다 많아, 분배 후 길자금이 '+fmtM(p.bal-res.totalPayout)+'(마이너스)가 됩니다. 마이너스로도 분배할 수 있습니다.');
  if(res.retained>0) notes.push('길드자금 적립 '+fmtM(res.retained)+'은 지급하지 않고 길자금에 그대로 남습니다.');
  if(res.leftover-res.retained>0) notes.push('지급 단위로 내림하고 남는 금액 '+fmtM(res.leftover-res.retained)+'도 길자금에 남습니다.');
  if(res.overage>0) notes.push('동순위 전액 지급으로 분배 대상 금액을 '+fmtM(res.overage)+' 초과합니다. 초과분도 길자금에서 지급됩니다.');
  res.comps.forEach(c=>{ const inf=res.info[c.id]; if(inf&&inf.bonusOut) notes.push('"'+c.name+'" 몫 '+fmtM(inf.gross)+'에서 포상 '+fmtM(inf.bonusOut)+' 차감 → '+fmtM(inf.pool)); if(inf&&inf.per!==undefined) notes.push('"'+c.name+'" 횟차별 비용: '+fmtM(inf.per)+' (총 '+fmtN(inf.totalCount)+'회)'); });
  const sum=$('#dSum');
  if(sum) sum.innerHTML='<div><span class="k">분배 대상 금액</span><span class="v">'+fmtM(pool)+'</span></div>'+
    (res.bonusTotal>0?'<div><span class="k">포상(수고비) 합계</span><span class="v" style="color:var(--purple)">'+fmtM(res.bonusTotal)+'</span></div>':'')+
    (res.retained>0?'<div><span class="k">길드자금 적립 (지급 안 함)</span><span class="v" style="color:var(--teal)">'+fmtM(res.retained)+'</span></div>':'')+
    '<div><span class="k">총 지급액 (길자금 지출)</span><span class="v neg">'+fmtM(res.totalPayout)+'</span></div>'+
    '<div><span class="k">분배 후 길자금 잔액</span><span class="v '+(p.bal-res.totalPayout<0?'neg':'')+'">'+fmtM(p.bal-res.totalPayout)+'</span></div>';
  const msgs=$('#dMsgs');
  if(msgs) msgs.innerHTML=errs.map(e=>'<div class="notice bad">'+esc(e)+'</div>').join('')+res.warns.map(e=>'<div class="notice warn">'+esc(e)+'</div>').join('')+notes.map(e=>'<div class="notice">'+esc(e)+'</div>').join('');
  const btn=$('#btnDistDone'); if(btn) btn.disabled=errs.length>0;
}

// 길드원별 × 날짜별 지급 현황 (칸을 누르면 지급 완료/미지급 전환)
function boardBody(done){
  const names=new Map(); done.forEach(d=>d.results.forEach(r=>{ if(!names.has(r.memberId)) names.set(r.memberId,r.name); }));
  const order=new Map(S.members.map((m,i)=>[m.id,i]));
  const ids=Array.from(names.keys()).sort((a,b)=>(order.has(a)?order.get(a):9999)-(order.has(b)?order.get(b):9999));
  let total=0, paid=0, rec=0; done.forEach(d=>d.results.forEach(r=>{ total+=num(r.total); if(r.paid) paid+=num(r.total); else if(r.recovered) rec+=num(r.total); }));
  let b='<p class="hint">길드원별 날짜별 지급액입니다. 칸을 클릭하면 <b class="pos">지급 완료</b> ↔ <b class="neg">미지급</b>으로 바뀝니다. 지급하지 못한 몫은 "날짜별 분배 정리"에서 <b style="color:#5aa9ff">회수</b>(길자금 수입)할 수 있습니다.</p>'+
    '<div class="tablewrap"><table class="tbl mat" style="min-width:'+(260+done.length*150)+'px"><thead><tr><th>길드원</th>'+
    done.map(d=>{ const pc=d.results.filter(r=>r.paid||r.recovered).length; return '<th class="num">'+esc(d.date)+'<br><span class="small" style="font-weight:600;color:var(--coin)">'+esc((d.title||'').slice(0,16))+'</span><br><span class="small" style="font-weight:500">정산 '+pc+'/'+d.results.length+'</span></th>'; }).join('')+
    '<th class="num">합계</th><th class="num">미지급</th></tr></thead><tbody>';
  ids.forEach(mid=>{
    let sum=0, unp=0;
    b+='<tr><td>'+esc(names.get(mid))+'</td>';
    done.forEach(d=>{
      const r=d.results.find(x=>x.memberId===mid);
      if(!r){ b+='<td class="num muted">-</td>'; return; }
      sum+=num(r.total); if(!r.paid&&!r.recovered) unp+=num(r.total);
      if(r.recovered){ b+='<td class="num cellp recov" data-act="togglePaid" data-d="'+esc(d.id)+'" data-m="'+esc(mid)+'" title="회수됨 '+esc(r.recoverAt||'')+(r.recoverWhy?' · '+esc(r.recoverWhy):'')+'"><span class="strike">'+fmtM(r.total)+'</span><div class="small">💰 회수 '+fmtM(r.recovered)+'</div></td>'; return; }
      b+='<td class="num cellp '+(r.paid?'paid':'unpaid')+'" data-act="togglePaid" data-d="'+esc(d.id)+'" data-m="'+esc(mid)+'" title="클릭하면 지급 완료/미지급이 바뀝니다">'+fmtM(r.total)+'</td>';
    });
    b+='<td class="num"><b>'+fmtM(sum)+'</b></td><td class="num '+(unp>0?'neg':'muted')+'">'+(unp>0?fmtM(unp):'-')+'</td></tr>';
  });
  return b+'</tbody><tfoot><tr><td>날짜별 합계</td>'+done.map(d=>'<td class="num">'+fmtM(d.summary.totalPayout)+'</td>').join('')+'<td class="num">'+fmtM(total)+'</td><td class="num">'+fmtM(total-paid-rec)+'</td></tr></tfoot></table></div>'+
    (rec?'<p class="small muted" style="margin:8px 0 0">회수된 분배금 합계 <b style="color:#5aa9ff">'+fmtM(rec)+'</b> (미지급에서 제외 · 길자금 수입으로 기록됨)</p>':'');
}
// 분배 항목별로 "어떻게 나눴는지" 한 줄 설명
function compHow(c,d){
  const inf0=(d.compInfo||{})[c.id]||{}, cut=inf0.bonusOut?' · 몫 '+fmtM(inf0.gross)+'에서 포상 '+fmtM(inf0.bonusOut)+' 차감':'';
  if(c.type==='bonus'){ const comps=d.compsSnap||[], f=c.from, tgt=comps.find(x=>x.id===f);
    const who=d.results.filter(r=>num(r.parts[c.id])>0).sort((a,b)=>num(b.parts[c.id])-num(a.parts[c.id])).map(r=>esc(r.name)+' '+fmtM(r.parts[c.id])).join(' · ');
    return who+'<div class="small muted">'+(f===undefined?'이전 방식 · 분배 대상 전체에서 먼저 차감 (1회성 예외로 그대로 보존)':f==='pool'?'분배 대상 전체에서 먼저 차감':'"'+esc(tgt?tgt.name:'분배')+'" 몫에서 차감')+'</div>'; }
  if(c.type==='guild') return '지급하지 않고 길자금에 적립 ('+r2(num(c.pct))+'%)'+cut;
  const rs=d.results.filter(r=>num(r.parts[c.id])>0);
  if(!rs.length) return '지급 없음';
  if(c.type==='base') return '참여자 1인당 '+fmtM(c.amount)+' × '+rs.length+'명';
  if(c.type==='equal') return rs.length+'명 균등 · 1인당 '+fmtM(rs[0].parts[c.id])+' ('+r2(num(c.pct))+'%'+cut+')';
  if(c.type==='perCount'){
    const info=(d.compInfo||{})[c.id]; const tc=info&&info.totalCount!==undefined?info.totalCount:rs.reduce((a,r)=>a+num(r.count),0);
    const per=info&&info.per!==undefined?info.per:rs.reduce((a,r)=>a+num(r.parts[c.id]),0)/Math.max(1,tc);
    return '횟차별 '+fmtM(per)+' × 총 '+fmtN(tc)+'회 ('+r2(num(c.pct))+'%'+cut+')';
  }
  return rs.slice().sort((a,b)=>num(b.parts[c.id])-num(a.parts[c.id])).map(r=>esc(r.name)+' '+fmtM(r.parts[c.id])).join(' · ');
}

      '<div class="stack">'+sums.map(x=>'<i style="width:'+(x.sum/den*100)+'%;background:'+(COMP_COLOR[x.c.type]||'var(--muted)')+'" title="'+esc(x.c.name)+' '+fmtM(x.sum)+'"></i>').join('')+'</div>'+
      '<div class="tablewrap" style="margin-bottom:14px"><table class="tbl fixed"><colgroup><col style="width:190px"><col style="width:150px"><col style="width:70px"><col></colgroup><thead><tr><th>분배 항목</th><th class="num">금액</th><th class="num">비중</th><th>어떻게 나눴나</th></tr></thead><tbody>'+
      sums.map(x=>'<tr><td><span class="dot" style="background:'+(COMP_COLOR[x.c.type]||'var(--muted)')+'"></span><b>'+esc(x.c.name)+'</b></td><td class="num">'+fmtM(x.sum)+'</td><td class="num">'+Math.round(x.sum/den*100)+'%</td><td class="wrap">'+compHow(x.c,d)+'</td></tr>').join('')+

           :'<label><input type="checkbox" '+(r.paid?'checked':'')+' data-chg="paid" data-d="'+esc(d.id)+'" data-m="'+esc(r.memberId)+'"> 지급 완료</label>'+(r.paid?'':' <button class="btn ghost sm" data-act="distRecover" data-d="'+esc(d.id)+'" data-m="'+esc(r.memberId)+'" title="지급하지 못한 몫을 길자금 수입으로 회수">💰 회수</button>'))+'</td></tr>';
    });

  });
  return '<p class="hint">날짜를 누르면 분배 비율·방식과 개인별 상세가 펼쳐집니다.</p>'+b;
}

const curRaid=()=>S.raids.find(r=>r.id===ui.raidId);

function raidList(){

// 빠른 입력: "품목 금액 구매자" 줄 → 판매 완료된 아이템 / 지출로 바로 기록
function parsePaste(text,r){
  const res={added:0,bad:[]}; const exp=new Set(S.settings.itemPresets.expense);
  text.split(/\r?\n/).forEach(line=>{
    line=line.trim(); if(!line) return;
    let type=null;
    if(/^(지출|비용)\s+/.test(line)){ type='expense'; line=line.replace(/^(지출|비용)\s+/,''); }
    const tk=line.split(/[\t,]+|\s+/).filter(Boolean);
    const ix=tk.findIndex(x=>/^-?\d+(\.\d+)?$/.test(x));
    if(ix<1){ res.bad.push(line); return; }
    let name=tk.slice(0,ix).join(' '), price=parseFloat(tk[ix]); const buyerTxt=tk.slice(ix+1).join(' ');
    if(name.startsWith('-')){ type='expense'; name=name.replace(/^-+\s*/,''); }
    if(price<0){ type='expense'; price=-price; }
    price=Math.round(price);
    if(!name||!(price>0)){ res.bad.push(line); return; }
    if(!type) type=exp.has(name)?'expense':'income';
    if(type==='expense') r.expenses.push({id:uid(),name,price,note:buyerTxt,date:today()});
    else{
      const mem=buyerTxt&&S.members.find(m=>m.name===buyerTxt);
      catalogTouch(name); catalogSold(name,price); r.lots.push({id:uid(),name,qty:1,state:'sold',price,buyers:[mem?{id:mem.id,name:mem.name}:{id:'__ext',name:buyerTxt||'외부/기타'}],bidders:[],soldDate:today()});
    }
    res.added++;
  });
  return res;
}

  S.distributions.filter(d=>d.status==='completed').forEach(d=>d.results.forEach(r=>{

/* ---- 공성전 출석: 매주 일요일 20:00~21:00 공성전, 19:30 ~ 23:59 출석 체크 (그 주만) ---- */

const noticeSort=(a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(a.date<b.date?1:a.date>b.date?-1:0)||((b.createdAt||'')<(a.createdAt||'')?-1:1);

function richText(t){      // 줄바꿈 유지 + http(s) 주소 자동 링크 (HTML은 모두 이스케이프)

  return out+esc(t.slice(last));
}

const A={};
A.adminAuth=async()=>{
  if(ui.admin) return toast('이미 관리자 모드입니다');
  const res=await modal({title:'🔑 로그인',ok:'로그인',body:'<p class="hint" style="margin-top:0">비밀번호에 따라 권한이 정해집니다 — <b>관리자</b>: 모든 입력·수정·삭제·백업 / <b>👑 군주</b>: 공지사항 작성·수정·삭제. 30분간 활동이 없으면 자동으로 해제됩니다.</p><div class="field"><label>비밀번호</label><input type="password" id="admPw" inputmode="numeric" autocomplete="off" placeholder="비밀번호 입력"></div>',
    onOpen(root){ root.querySelector('#admPw').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); root.querySelector('[data-m=ok]').click(); } }); },
    onOk(root){
      const now=Date.now();
      if(now<ui.authBlock){ toast('시도 횟수를 초과했습니다. '+Math.ceil((ui.authBlock-now)/1000)+'초 후 다시 시도하세요'); return false; }
      const pw=root.querySelector('#admPw').value;
      const h=sha256(ADMIN_SALT+pw);
      if(h===ADMIN_HASH){ ui.authFail=0; return 'admin'; }
      if(h===LORD_HASH){ ui.authFail=0; return 'lord'; }
      ui.authFail++; if(ui.authFail>=5){ ui.authBlock=now+30000; ui.authFail=0; toast('비밀번호가 5회 틀렸습니다. 30초 후 다시 시도하세요'); }
      else toast('비밀번호가 올바르지 않습니다 ('+(5-ui.authFail)+'회 남음)');
      root.querySelector('#admPw').value=''; return false;

  const errs=res.errors.slice();
  if(pool<=0) errs.push('분배 RULE에서 분배 기준 금액을 입력하세요.');

  const lid=uid(), nameOf=id=>(S.members.find(m=>m.id===id)||{}).name||'(삭제됨)';
  d.title=title; d.status='completed'; d.completedAt=new Date().toISOString(); d.ledgerId=lid; d.unitSnap=S.rule.roundUnit; d.poolAmount=pool;
  d.compsSnap=S.rule.components.filter(c=>c.enabled).map(c=>{ const x=JSON.parse(JSON.stringify(c)); if(x.type==='bonus') x.from=res.bonusFrom[c.id]||'pool'; return x; });
  d.compInfo={}; res.comps.forEach(c=>{ const inf=res.info[c.id]; if(!inf) return; const o={};
    if(inf.per!==undefined){ o.per=inf.per; o.totalCount=inf.totalCount; } if(inf.retained!==undefined) o.retained=Math.round(inf.retained);
    if(inf.bonusOut){ o.bonusOut=Math.round(inf.bonusOut); o.gross=Math.round(inf.gross); } if(Object.keys(o).length) d.compInfo[c.id]=o; });
  d.summary={totalPayout:res.totalPayout,overage:res.overage,leftover:res.leftover,retained:res.retained,n:res.n};

const mkStock=(name,r)=>({id:uid(),name,from:r?r.id:'',fromTitle:r?(r.title||''):'',date:r?r.date:today(),at:today()});
// 아이템 목록에 사용 기록 (처음 보는 이름이면 '잡템'으로 자동 추가) → 새로 추가됐으면 true
function catalogTouch(name,count){
  const n=normName(name); if(!n) return false; const k=n.toLowerCase();
  const C=S.settings.itemCatalog||(S.settings.itemCatalog=[]); let it=C.find(x=>x.name.toLowerCase()===k), isNew=false;
  const H=S.settings.itemHidden||(S.settings.itemHidden=[]);
  if(!it&&count===false&&H.includes(k)) return false;                 // 목록에서 지운 아이템은 판매 기록만으로는 다시 추가하지 않음
  if(H.includes(k)) S.settings.itemHidden=H.filter(x=>x!==k);         // 다시 직접 등록하면 목록에 복귀
  if(!it){ it={id:uid(),name:n,cat:'misc',uses:0,last:'',price:0,soldPrice:0,soldAt:'',prevPrice:0,auto:true}; C.push(it); isNew=true; }
  if(count!==false){ it.uses=(it.uses||0)+1; it.last=today(); }
  return isNew;
}
const catPrice=name=>{ const n=normName(name).toLowerCase(); const it=(S.settings.itemCatalog||[]).find(x=>x.name.toLowerCase()===n); return it?Math.round(num(it.price)):0; };
// 판매 확정 시: 그 아이템의 기본 가격을 최근 판매가로 자동 갱신 → 바뀐 경우 이전 가격 반환
function catalogSold(name,price,date){
  price=Math.round(num(price)); if(!(price>0)) return null;
  catalogTouch(name,false);
  const n=normName(name).toLowerCase(), it=S.settings.itemCatalog.find(x=>x.name.toLowerCase()===n); if(!it) return null;
  const prev=Math.round(num(it.price)), changed=prev!==price;
  if(changed) it.prevPrice=prev; it.price=price; it.soldPrice=price; it.soldAt=date||today();
  return changed?{prev,price}:null;
}
const priceMsg=ch=>ch?(ch.prev>0?' · 기본 가격 '+fmtM(ch.prev)+' → '+fmtM(ch.price)+' 갱신':' · 기본 가격 '+fmtM(ch.price)+' 저장'):'';
const catalogSorted=cat=>(S.settings.itemCatalog||[]).filter(x=>!cat||cat==='all'||(cat==='auto'?x.auto:x.cat===cat)).slice().sort((a,b)=>(b.uses||0)-(a.uses||0)||a.name.localeCompare(b.name,'ko'));
const newLot=(name,qty)=>{ catalogTouch(name); return {id:uid(),name:normName(name),qty,state:'wait',price:0,buyers:[],bidders:[]}; };

async function saleFlow(r,lot){
  const res=await openSaleModal(r,lot); if(!res||res===true) return;
  lot.price=res.price; lot.buyers=res.buyers; lot.bidders=res.bidders; lot.drawId=res.drawId; lot.state='sold'; lot.soldDate=today();
  const rem=lot.qty-res.buyers.length;
  if(rem>0){ for(let i=0;i<rem;i++) S.stock.push(mkStock(lot.name,r)); lot.qty=res.buyers.length; }
  const ch=catalogSold(lot.name,res.price);
  commit(); toast(lot.name+' 판매 입력 완료 · '+fmtM(lotTotal(lot))+(rem>0?' · 남은 '+rem+'개는 미판매 재고로 이월':'')+priceMsg(ch));
}
A.lotSell=el=>{ const r=curRaid(), l=r&&r.lots.find(x=>x.id===el.dataset.id); if(l) saleFlow(r,l); };
A.lotUnsold=el=>{
  const r=curRaid(), l=r&&r.lots.find(x=>x.id===el.dataset.id); if(!l) return;
  for(let i=0;i<l.qty;i++) S.stock.push(mkStock(l.name,r));
  r.lots=r.lots.filter(x=>x!==l); commit(); toast(l.name+' '+l.qty+'개를 미판매 재고템 탭으로 이월했습니다');
};
A.lotUndo=async el=>{
  const r=curRaid(), l=r&&r.lots.find(x=>x.id===el.dataset.id); if(!l) return;
  if(!await confirmBox('"'+l.name+'" 판매를 취소하고 판매 대기로 되돌릴까요?',{ok:'판매 취소'})) return;
  l.state='wait'; l.price=0; l.buyers=[]; commit();
};
A.lotDel=async el=>{
  const r=curRaid(), l=r&&r.lots.find(x=>x.id===el.dataset.id); if(!l) return;
  if(!await confirmBox('"'+l.name+'" 등록을 삭제할까요?\n(판매되지 않았다면 "미판매" 버튼으로 재고에 이월할 수 있습니다)',{ok:'삭제',danger:true})) return;
  r.lots=r.lots.filter(x=>x!==l); commit();
};
A.expAdd=el=>{
  const r=curRaid(), box=el.closest('.expadd'), en=box.querySelector('.en'), ea=box.querySelector('.ea');
  const name=en.value.trim(), price=Math.round(num(ea.value)), date=box.querySelector('.ed').value;
  if(!name) return en.focus();
  if(!(price>0)){ toast('금액을 입력하세요 (만 실버 단위)'); return ea.focus(); }
  r.expenses.push({id:uid(),name,price,note:box.querySelector('.eb').value.trim(),date:/^\d{4}-\d{2}-\d{2}$/.test(date)?date:today()});
  commit(); toast('지출 '+fmtM(price)+'을 추가했습니다');
};
A.expDel=el=>{ const r=curRaid(); r.expenses=r.expenses.filter(x=>x.id!==el.dataset.id); commit(); };
A.raidComplete=async()=>{
  const r=curRaid(); if(!r||r.status==='completed') return;
  const t=raidTotals(r), wait=r.lots.filter(l=>!lotSold(l));
  if(!r.lots.some(lotSold)&&!r.expenses.length) return toast('판매 완료된 아이템이나 지출 내역이 없습니다');
  if(t.net===0) return toast('정산금이 0입니다. 판매 수입과 지출을 확인하세요');
  const waitQty=wait.reduce((a,l)=>a+l.qty,0);
  const res=await modal({title:'판매 완료 → 길자금 수입',ok:'길자금에 반영',
    body:'<div class="eq" style="margin:0 0 14px"><div class="eqb in"><span>판매 수입</span><b>'+fmtM(t.inc)+'</b></div><div class="op">−</div><div class="eqb out"><span>지출</span><b>'+fmtM(t.exp)+'</b></div></div>'+
      '<p style="margin-top:0">정산금 <b>'+fmtM(t.net)+'</b> 실버를 길자금 '+(t.net>0?'수입':'지출')+' <b>1건</b>으로 기록합니다.</p>'+
      (waitQty?'<div class="notice warn" style="margin:0 0 12px">판매 대기 중인 아이템 '+waitQty+'개는 <b>미판매 재고템으로 이월</b>됩니다.</div>':'')+
      '<div class="field"><label>길자금 반영일</label><input type="date" id="cDate" value="'+today()+'"></div>',
    onOk(root){ const date=root.querySelector('#cDate').value; if(!date){ toast('반영일을 선택하세요'); return false; } return {date}; }});
  if(!res||res===true) return;
  r.carried=[]; wait.forEach(l=>{ for(let i=0;i<l.qty;i++){ const x=mkStock(l.name,r); S.stock.push(x); r.carried.push(x.id); } });
  r.lots=r.lots.filter(lotSold);
  const lid=uid();
  S.ledger.push({id:lid,date:res.date,type:t.net>0?'income':'expense',category:'레이드 정산',amount:Math.abs(t.net),
    memo:(r.title||'레이드')+' · 판매 수입 '+fmtM(t.inc)+' − 지출 '+fmtM(t.exp),ref:{kind:'raid',id:r.id}});
  r.status='completed'; r.ledgerId=lid; r.snap={date:res.date,net:t.net,inc:t.inc,exp:t.exp};
  commit(); toast('길자금에 반영했습니다 · 정산금 '+fmtM(t.net)+(waitQty?' · 재고 '+waitQty+'개 이월':''));
};
A.raidUncomplete=async()=>{
  const r=curRaid(); if(!r||r.status!=='completed') return;
  const rest=S.ledger.filter(e=>e.id!==r.ledgerId);
  let bal=0; rest.forEach(e=>{ bal+=e.type==='income'?num(e.amount):-num(e.amount); });
  if(!await confirmBox('완료를 취소하면 길자금에 기록된 정산금 내역이 삭제되고 다시 수정할 수 있게 됩니다.\n이월했던 재고템은 판매 대기로 되돌아옵니다.'+(bal<0?'\n\n⚠ 취소하면 길자금이 '+fmtM(bal)+'(마이너스)가 됩니다.':''),{ok:'완료 취소',danger:true})) return;
  S.ledger=rest;
  const back=new Map();
  (r.carried||[]).forEach(id=>{ const i=S.stock.findIndex(x=>x.id===id&&!x.own); if(i>=0){   // 길드 귀속·사용한 아이템은 되돌리지 않음
 const x=S.stock.splice(i,1)[0]; back.set(x.name,(back.get(x.name)||0)+1); } });
  back.forEach((q,name)=>r.lots.push(newLot(name,q)));
  r.carried=[]; r.status='draft'; delete r.snap; delete r.ledgerId; commit();
};
A.raidPaste=async()=>{

    '<textarea id="pasteTx" rows="9" placeholder="롱쉴드 5000 와꾸&#10;거친 50000 마린&#10;봉줌 1층 10000"></textarea>',

    const setParse=(cls,txt)=>{ const o=$q('#clParse'); if(o){ o.className='small '+cls; o.textContent=txt; } };
    const tryParse=()=>{
      const ta=$q('#clCfg'); if(!ta) return false; const btn=$q('[data-cl=save]'), t=ta.value;
      btn.disabled=true; if(!t.trim()){ setParse('muted','붙여넣거나 파일을 올리면 자동으로 인식합니다.'); return false; }
      if(isRules(t)){ setParse('neg','이 내용은 보안 규칙입니다. 규칙에는 연결 정보가 없어 연결할 수 없습니다. 규칙은 아래 ② 규칙 점검에서 검사하고, 연결에는 콘솔의 firebaseConfig 가 필요합니다.'); return false; }
      try{ const c=parseFbConfig(t); setParse('pos','✓ 인식됨 — 프로젝트: '+c.projectId+' · 앱 ID: '+c.appId.slice(0,18)+'…'); btn.disabled=false; return c; }
      catch(e){ setParse('neg','아직 인식되지 않았습니다: '+e.message); return false; }
    };
    // 저장 → 바로 연결(새로고침 없이) → 결과를 화면에 표시
    const connect=async()=>{
      const c=tryParse(); if(!c) return;
      try{ localStorage.setItem('r2_guild_fb_config',JSON.stringify(c)); }catch(e){ return setParse('neg','이 브라우저가 설정 저장을 막고 있습니다: '+e.message); }
      setParse('muted','설정을 저장했습니다. 연결하는 중…'); $q('[data-cl=save]').disabled=true;
      Cloud.trace=[]; await cloudStart();
      for(let i=0;i<50&&Cloud.state==='loading';i++) await waitMs(150);
      root.querySelector('[data-m=ok]').click(); setTimeout(()=>A.cloudOpen({autoDiag:true}),60);
    };
    const cfgFile=async f=>{ try{ const t=await readFile(f); const ta=$q('#clCfg'); if(!ta) return; ta.value=t; if(tryParse()) connect(); }catch(e){ toast(e.message); } };
    const ruleFile=async f=>{ try{ const t=await readFile(f); $q('#clRules').value=t; doLint(t); }catch(e){ toast(e.message); } };
    const wireDrop=(id,fn)=>{ const z=$q(id); if(!z) return; ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev,e=>{ e.preventDefault(); z.classList.add('over'); })); ['dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{ e.preventDefault(); z.classList.remove('over'); }));
      z.addEventListener('drop',e=>{ const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) fn(f); }); };
    wireDrop('#clDropCfg',cfgFile); wireDrop('#clDropRule',ruleFile);
    const fc=$q('#clFile'); if(fc) fc.addEventListener('change',()=>{ if(fc.files[0]) cfgFile(fc.files[0]); });
    const fr=$q('#clRuleFile'); if(fr) fr.addEventListener('change',()=>{ if(fr.files[0]) ruleFile(fr.files[0]); });
    const ta=$q('#clCfg'); if(ta) ta.addEventListener('input',tryParse);
    const rt=$q('#clRules'); if(rt) rt.addEventListener('input',()=>{ if(rt.value.trim()) doLint(rt.value); else $q('#clLint').innerHTML=''; });
    const runDiag=async()=>{ const box=$q('#clOut'); if(!box) return; box.innerHTML='<div class="small muted">진단 중…</div>'; try{ box.innerHTML=lintHtml(await cloudDiagnose()); }catch(err){ box.innerHTML='<div class="notice bad">진단 실패: '+esc(err.message)+'</div>'; } };
    sc.addEventListener('click',async e=>{
      const t=e.target.closest('[data-cl]'); if(!t) return; const k=t.dataset.cl;
      if(k==='save') connect();
      else if(k==='fullResync'){ Cloud.noMirror=true; clearTimeout(Cloud.mirTimer); try{ localStorage.removeItem(MIRROR_KEY); }catch(x){} toast('사본을 지웠습니다 — 전체 문서를 다시 받습니다'); setTimeout(()=>location.reload(),400); }
      else if(k==='fromTimer'){
        const url=S.settings.hammerUrl||HAMMER_URL; setParse('muted','캐쉬템 페이지를 읽는 중… ('+url+')');
        try{ const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error('페이지를 열 수 없습니다 (HTTP '+res.status+')'); const txt=await res.text(); const c=parseFbConfig(txt);
          $q('#clCfg').value='const firebaseConfig = '+JSON.stringify(c,null,2)+';'; if(tryParse()){ setParse('pos','✓ 캐쉬템 페이지에서 설정값을 찾았습니다 — 프로젝트: '+c.projectId+'. 연결합니다…'); connect(); } }
        catch(err){ setParse('neg','자동으로 가져오지 못했습니다: '+err.message+(/parseFb|찾지 못/.test(err.message)?' (캐쉬템 페이지에 설정값이 직접 들어 있지 않거나, 다른 프로젝트일 수 있습니다. 콘솔의 firebaseConfig 를 직접 붙여넣어 주세요)':'')); }
      }
      else if(k==='lint'){ const v=rt.value; if(!v.trim()) return toast('규칙을 붙여넣거나 파일을 올려 주세요'); doLint(v); }
      else if(k==='retry'){ Cloud.enabled=false; Cloud.m=null; Cloud.trace=[]; await cloudStart(); for(let i=0;i<50&&Cloud.state==='loading';i++) await waitMs(150); root.querySelector('[data-m=ok]').click(); setTimeout(()=>A.cloudOpen({autoDiag:true}),60); }
      else if(k==='clear'){ localStorage.removeItem('r2_guild_fb_config'); toast('설정을 삭제했습니다. 새로 불러옵니다'); setTimeout(()=>{ try{ location.reload(); }catch(x){} },600); }
      else if(k==='upload'){
        if(!ui.admin) return toast('관리자 인증이 필요합니다');
        t.disabled=true; logEvent('[클라우드] 현재 데이터 업로드 (문서 '+collectDocs(S).size+'개)'); Cloud.uploading=true; Cloud.allowMass=true; Cloud.localDirty=true; await cloudPush(); Cloud.uploading=false; if(Cloud.state!=='error'){ Cloud.synced=true; toast('클라우드에 올렸습니다'); } $q('#clOut').textContent='';
      } else if(k==='diag') runDiag();
      else if(k==='syncNow'){ if(!ui.admin) return toast('관리자 인증이 필요합니다'); Cloud.localDirty=true; await cloudPush(); toast(Cloud.state==='error'?'동기화 실패: '+Cloud.err:'☁ 동기화 완료 — 클라우드 문서 '+Cloud.docs.size+'개'); }
      else if(k==='embedDl'){
        const box=$q('#clEmbed'); box.innerHTML='<div class="small muted">파일을 만드는 중…</div>';
        const html=await buildEmbeddedHtml(Cloud.cfg);
        if(!html){ box.innerHTML='<div class="notice bad">파일을 만들지 못했습니다. 파일 위쪽의 <code>const FIREBASE_CONFIG = null;</code> 을 직접 아래 값으로 바꿔 주세요.</div><pre class="small" style="white-space:pre-wrap">const FIREBASE_CONFIG = '+esc(JSON.stringify(cfgMin(Cloud.cfg),null,2))+';</pre>'; return; }
        const last=location.pathname.split('/').pop()||'', name=last.endsWith('.html')?last:'r2_main.html';
        const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(x){} a.remove(); },800);
        box.innerHTML='<div class="notice ok">✓ <b>'+esc(name)+'</b> 파일을 받았습니다. GitHub 저장소에 같은 이름으로 올려(덮어쓰기) 주세요. 반영되면 모든 기기에서 자동으로 연결됩니다.</div>';
      }
      else if(k==='copyLink'){
        const link=cfgLink(Cloud.cfg), box=$q('#clEmbed');
        try{ await navigator.clipboard.writeText(link); toast('연결 링크를 복사했습니다'); }catch(x){}
        box.innerHTML='<div class="field"><label>연결 링크 (이 링크로 한 번 열면 그 브라우저는 계속 자동 연결)</label><input readonly value="'+esc(link)+'"></div>';
      }
      else if(k==='logs'){
        const box=$q('#clOut'); box.textContent='불러오는 중…';
        try{ const rows=await cloudLogs(); box.innerHTML=rows.length?'<div class="tablewrap"><table class="tbl fixed" style="min-width:0"><colgroup><col style="width:140px"><col></colgroup><thead><tr><th>일시</th><th>내용</th></tr></thead><tbody>'+rows.map(r=>'<tr><td class="nowrap">'+esc(fmtTs(r.at))+'</td><td class="wrap">'+esc(r.text||'')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">기록이 없습니다.</div>'; }
        catch(err){ box.innerHTML='<div class="notice bad">기록을 불러오지 못했습니다: '+esc(diagHint(err,'read'))+'</div>'; }
      }
    });
    if(auto&&$q('[data-cl=diag]')) runDiag();
  }});
};

// 선택: { 재고키: 수량 } (판매 가능한 재고만, 사라진 항목은 자동 정리)
function bundleSel(){ const sel=ui.bsel||(ui.bsel={}); const avail=new Map(); stockAvail().forEach(x=>{ const k=stockKey(x); avail.set(k,(avail.get(k)||0)+1); });
  Object.keys(sel).forEach(k=>{ const n=avail.get(k)||0; if(!n) delete sel[k]; else sel[k]=Math.max(1,Math.min(n,Math.round(sel[k])||1)); }); return sel; }
A.bClear=()=>{ ui.bsel={}; render(); };
A.bundleSell=async()=>{
  const sel=bundleSel(), keys=Object.keys(sel); if(!keys.length) return toast('묶음에 넣을 재고템을 체크하세요');
  const picked=[], lines=[], srcs=new Set();
  keys.forEach(k=>{ const items=stockAvail().filter(x=>stockKey(x)===k).slice(0,sel[k]); if(!items.length) return; picked.push(...items); srcs.add(stockSrc(items[0]));
    const ln=lines.find(l=>l.name===items[0].name); if(ln) ln.qty+=items.length; else lines.push({name:items[0].name,qty:items.length}); });
  if(!picked.length) return;
  const total=picked.length, suggest=lines.reduce((a,l)=>a+catPrice(l.name)*l.qty,0), label=lines.map(l=>l.name+(l.qty>1?'×'+l.qty:'')).join(', ');
  const lot={id:uid(),name:'묶음 ('+total+'개)',qty:1,price:0,buyers:[],bidders:[],drawId:null,bundle:{lines,total,suggest}};
  const res=await openSaleModal({id:'',title:'재고템 묶음'},lot); if(!res||res===true) return;
  const ids=new Set(picked.map(x=>x.id)); S.stock=S.stock.filter(x=>!ids.has(x.id));
  const sid=uid(), lid=uid(), date=today(), src=Array.from(srcs).join(' / ');
  S.ledger.push({id:lid,date,type:'income',category:'재고템 판매',amount:res.price,
    memo:'묶음: '+label+' → '+groupNames(res.buyers.map(b=>b.name))+' · 출처: '+src,ref:{kind:'stock',raidId:'',saleId:sid}});
  S.stockSales.push({id:sid,date,name:'묶음 ('+total+'개)',bundle:true,lines,qty:total,price:res.price,buyers:res.buyers,drawId:res.drawId,fromRaid:'',fromTitle:src,fromDate:'',ledgerId:lid,items:picked});
  ui.bsel={}; commit(); toast('📦 묶음 판매 완료 ('+label+') · 길자금 수입 +'+fmtM(res.price)+' → '+groupNames(res.buyers.map(b=>b.name)));
};

  name=name.trim(); if(!name) return false;

}

    onOk(root){ return root.querySelector('#bulkTx').value; }});
  if(!res||res===true) return;
  const list=[]; let last=null;
  res.split(/\r?\n/).forEach(line=>line.split(/[\t,\s]+/).filter(Boolean).forEach(t=>{

  }));
