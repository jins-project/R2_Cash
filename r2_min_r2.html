// 길드원이 남긴 기록 찾기 (하나라도 있으면 삭제하지 않고 비활동으로 관리)
function memberRefs(id){
  const out=[], has=a=>(a||[]).some(x=>(x&&typeof x==='object'?x.id:x)===id);
  const n1=S.distributions.filter(d=>d.status==='completed'&&(d.results||[]).some(r=>r.memberId===id)).length; if(n1) out.push('완료된 분배 '+n1+'건');
  const dr=S.distributions.find(d=>d.status==='draft'); if(dr&&(rowHasInput((dr.rows||[]).find(r=>r.memberId===id))||(dr.parked&&rowHasInput(dr.parked[id])))) out.push('진행 중인 분배 입력값');
  let nb=0, nbid=0; S.raids.forEach(r=>(r.lots||[]).forEach(l=>{ if(has(l.buyers)) nb++; else if(has(l.bidders)) nbid++; }));
  if(nb) out.push('레이드 낙찰 '+nb+'건'); if(nbid) out.push('레이드 입찰 '+nbid+'건');
  const nd=S.draws.filter(d=>(d.bidderIds||[]).includes(id)||has(d.winners)).length; if(nd) out.push('보물상자 뽑기 '+nd+'건');
  const ns=S.stockSales.filter(x=>has(x.buyers)||has(x.bidders)).length; if(ns) out.push('재고템 판매 '+ns+'건');
  const nn=S.notices.filter(n=>(n.attendees||[]).includes(id)).length; if(nn) out.push('회의 참석 '+nn+'건');
  return out;
}
A.memDel=async el=>{
  const m=S.members.find(x=>x.id===el.dataset.id); if(!m) return;
  const refs=memberRefs(m.id);
  if(refs.length){
    const off=m.status==='left';
    const ok=await confirmBox('"'+m.name+'" 님은 아래 기록이 있어 삭제할 수 없습니다.\n\n· '+refs.join('\n· ')+'\n\n삭제하면 이 기록들의 이름 표시·통계가 끊어질 수 있어, 기록이 있는 길드원은 '+(off?'비활동 상태로 보관됩니다.':'"비활동"으로 바꿔 보관합니다.'),{ok:off?'확인':'비활동으로 변경',title:'삭제할 수 없는 길드원'});
    if(ok&&!off){ m.status='left'; commit(); toast('"'+m.name+'" 님을 비활동으로 바꿨습니다'); }
    return;
  }
  if(!await confirmBox('"'+m.name+'" 길드원을 삭제할까요?\n(남긴 기록이 없어 삭제해도 다른 데이터에 영향이 없습니다)',{ok:'삭제',danger:true})) return;
  S.members=S.members.filter(x=>x!==m); commit(); toast('삭제했습니다');
};

/* =====================================================================
   10-2. 클라우드(Firebase Firestore) 연동
   - 읽기: 누구나 / 쓰기: 관리자(Firebase 로그인)만  → 서버 규칙은 firestore.rules 참고
   - 저장 구조: r2guild/main/docs/{종류__ID} (건별 문서) + r2guild/main/logs (추가 전용 기록)
   - 화면(S)은 그대로 쓰고, 바뀐 문서만 골라 올리고(diff), 다른 사람의 변경은 실시간으로 받아옵니다.
   ===================================================================== */
const CLOUD_ROOT=['r2guild','main'], FB_VER='10.12.2';
const TYPE_OF={members:'member',ledger:'ledger',raids:'raid',distributions:'distribution',stock:'stock',stockSales:'stockSale',cash:'cash',draws:'draw',notices:'notice',siege:'siege'};
const stable=v=>{ if(Array.isArray(v)) return '['+v.map(stable).join(',')+']'; if(v&&typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}'; return JSON.stringify(v===undefined?null:v); };
const clean=o=>JSON.parse(JSON.stringify(o));
const safeId=id=>String(id==null?'':id).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,64)||'x';
function parseFbConfig(text){      // 콘솔에서 복사한 코드(import 줄 포함), JS 객체, JSON 파일을 모두 인식
  const keys=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId','databaseURL'];
  const re=/["']?([A-Za-z]\w*)["']?\s*:\s*(["'`])([^"'`]*)\2/g, out={}; let m;
  while((m=re.exec(text))){ if(keys.includes(m[1])&&!(m[1] in out)) out[m[1]]=m[3].trim(); }
  const miss=['apiKey','projectId','appId'].filter(k=>!out[k]);
  if(miss.length) throw new Error('설정값에서 '+miss.join(', ')+' 를 찾지 못했습니다');
  return out;
}
// 규칙 점검: 길자금 규칙(r2guild)이 올바른 위치에 있는지, 중괄호/함수가 맞는지 검사
function lintRules(src){
  const F=[], add=(lv,msg)=>F.push({lv,msg});
  const t=src.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'');
  if(!/service\s+cloud\.firestore/.test(t)) add('error','"service cloud.firestore { … }" 가 없습니다. Firestore 규칙 전체를 붙여넣으세요.');
  const paths=[], st=[], re=/match\s+(\/\S+)\s*\{|\{|\}/g; let m, extra=0;
  while((m=re.exec(t))){
    if(m[0]==='}'){ if(st.length) st.pop(); else extra++; }
    else if(m[1]){ paths.push((st.filter(Boolean).join('')+m[1]).replace(/\/+/g,'/')); st.push(m[1]); }
    else st.push(null);
  }
  if(extra) add('error','닫는 중괄호 } 가 '+extra+'개 더 많습니다.');
  if(st.length) add('error','여는 중괄호 { 가 '+st.length+'개 닫히지 않았습니다.');
  const goodDocs=/^\/databases\/\{[^}]+\}\/documents\/r2guild\/main\/docs\/\{[^}]+\}$/, goodLogs=/^\/databases\/\{[^}]+\}\/documents\/r2guild\/main\/logs\/\{[^}]+\}$/;
  const guild=paths.filter(p=>p.includes('r2guild'));
  guild.filter(p=>!goodDocs.test(p)&&!goodLogs.test(p)).forEach(p=>add('error','길자금 규칙이 다른 match 블록 안쪽(중첩)에 들어가 있습니다. 실제 적용 경로: '+p.replace('/databases/{database}/documents','…')+'  →  "match /r2guild/main/…" 블록을 "match /databases/{database}/documents {" 바로 아래(다른 match 바깥)로 옮기세요.'));
  const hasDocs=guild.some(p=>goodDocs.test(p)), hasLogs=guild.some(p=>goodLogs.test(p));
  if(!hasDocs) add('error','올바른 위치의 "match /r2guild/main/docs/{id}" 규칙이 없습니다.');
  if(!hasLogs) add('error','올바른 위치의 "match /r2guild/main/logs/{lid}" 규칙이 없습니다.');
  if(hasDocs&&!/'siege'/.test(t)) add('error','허용 종류 목록에 \'siege\'(공성전 출석)가 없습니다. 출석 저장이 거부되니 d.type in [...] 목록에 \'siege\'를 추가하세요.');
  const defs={}; (t.match(/function\s+\w+\s*\(/g)||[]).forEach(x=>{ const n=x.replace(/function\s+|\s*\($/g,''); defs[n]=(defs[n]||0)+1; });
  Object.keys(defs).forEach(n=>{ if(defs[n]>1) add('error','함수 "'+n+'" 가 '+defs[n]+'번 정의되어 있습니다(중복).'); });
  ['docOk','logOk','typeOk'].forEach(n=>{ if(new RegExp('\\b'+n+'\\s*\\(').test(t)&&!defs[n]) add('error','함수 "'+n+'" 를 사용하지만 정의가 없습니다.'); });
  if(hasDocs&&/request\.auth|isAdmin\s*\(/.test(t)) add('warn','로그인(request.auth / isAdmin)을 요구하는 조건이 보입니다. 이 앱은 로그인 없이 저장하므로, 해당 조건이 길자금 규칙에 걸려 있다면 저장이 거부됩니다. (기존 캐쉬템 규칙에서만 쓰는 것이라면 무시)');
  if(!F.some(x=>x.lv==='error')) add('ok','✓ r2guild/main/docs, r2guild/main/logs 규칙이 올바른 위치에 있고 구조가 맞습니다. (게시 후 ☁ 연결 진단으로 실제 동작을 확인하세요)');
  return F;
}
const lintHtml=F=>'<div class="diag">'+F.map(x=>'<div class="it '+(x.lv==='ok'?'ok':x.lv==='warn'?'warn':'bad')+'">'+(x.lv==='error'?'✗ ':x.lv==='warn'?'⚠ ':'')+esc(x.msg)+'</div>').join('')+'</div>';
function diagHint(e,kind){
  const c=((e&&e.code)||'').replace('firestore/','');
  if(c==='permission-denied') return kind==='read'?'권한 없음 — 콘솔에 게시된 규칙에 r2guild 읽기 규칙이 없거나, 위치(중첩)가 잘못됐습니다. "규칙 점검"으로 확인하세요.':'권한 없음 — logs 쓰기 규칙(logOk)이 없거나 위치가 잘못됐습니다. "규칙 점검"으로 확인하세요.';
  if(c==='unavailable') return '서버에 연결할 수 없습니다 (인터넷/방화벽 확인).';
  if(c==='not-found'||/database.*(not|does)/i.test((e&&e.message)||'')) return 'Firestore 데이터베이스가 아직 만들어지지 않았습니다 (콘솔 → Firestore Database → 데이터베이스 만들기).';
  return (e&&e.message)||c||'알 수 없는 오류';
}
async function cloudDiagnose(){
  const out=[], m=Cloud.m;
  out.push({lv:Cloud.cfg?'ok':'error',msg:Cloud.cfg?'설정값 인식: 프로젝트 "'+Cloud.cfg.projectId+'"':'설정값이 없습니다'});
  out.push({lv:m&&Cloud.state!=='sdkfail'?'ok':'error',msg:m&&Cloud.state!=='sdkfail'?'Firebase 라이브러리 불러오기 성공':'Firebase 라이브러리를 불러오지 못했습니다 (인터넷/방화벽, 또는 FB_VER 값 확인)'});
  if(!m||!Cloud.db) return out;
  try{ await m.getDocs(m.query(m.collection(Cloud.db,...CLOUD_ROOT,'docs'),m.limit(1))); out.push({lv:'ok',msg:'읽기 테스트 통과 (r2guild/main/docs)'}); }
  catch(e){ out.push({lv:'error',msg:'읽기 실패: '+diagHint(e,'read')}); }
  if(ui.admin){
    try{ const b=m.writeBatch(Cloud.db); b.set(m.doc(m.collection(Cloud.db,...CLOUD_ROOT,'logs')),{at:m.serverTimestamp(),by:'admin',text:'연결 테스트'}); await b.commit(); out.push({lv:'ok',msg:'쓰기 테스트 통과 (logs 에 "연결 테스트" 1건 기록)'}); }
    catch(e){ out.push({lv:'error',msg:'쓰기 실패: '+diagHint(e,'write')}); }
  } else out.push({lv:'warn',msg:'쓰기 테스트는 관리자 인증 후 할 수 있습니다.'});
  return out;
}

const cfgMin=c=>{ const o={}; ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(k=>{ if(c&&c[k]) o[k]=c[k]; }); return o; };
// 주소 끝의 #cfg=... (연결 링크)로 열면 이 브라우저에 설정을 저장하고 주소에서 지움
function cloudCfgFromHash(){
  try{
    const h=location.hash||''; if(!h.startsWith('#cfg=')) return false;
    const c=JSON.parse(decodeURIComponent(escape(atob(h.slice(5)))));
    if(!c||!c.apiKey||!c.projectId||!c.appId) return false;
    localStorage.setItem('r2_guild_fb_config',JSON.stringify(cfgMin(c)));
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; }
    return true;
  }catch(e){ return false; }
}
function cfgLink(c){ return location.origin+location.pathname+'#cfg='+btoa(unescape(encodeURIComponent(JSON.stringify(cfgMin(c))))); }
// 현재 페이지 원본에 설정값을 넣은 HTML 만들기 (GitHub에 올리면 모든 기기에서 자동 연결)
function embedCfg(src,c){
  const re=/^const FIREBASE_CONFIG = (?:null|\{[^;]*\});/m;     // 줄 맨 앞의 실제 선언만 (위쪽 주석의 예시는 건드리지 않음)
  if(!re.test(src)) return null;
  return src.replace(re,'const FIREBASE_CONFIG = '+JSON.stringify(cfgMin(c),null,2)+';');
}
function pageSourceFromDom(){
  const root=document.documentElement.cloneNode(true);
  ['#view','#modalRoot','#drawRoot'].forEach(sel=>{ const el=root.querySelector(sel); if(el) el.innerHTML=''; });
  const t=root.querySelector('#toast'); if(t){ t.textContent=''; t.className=''; }
  root.querySelectorAll('.lockd').forEach(e=>e.classList.remove('lockd'));
  root.querySelectorAll('.tab.on').forEach(e=>e.classList.remove('on'));
  return '<!DOCTYPE html>\n'+root.outerHTML;
}
async function buildEmbeddedHtml(c){
  let out=null;
  try{ const res=await fetch(location.href.split('#')[0],{cache:'no-store'}); if(res.ok) out=embedCfg(await res.text(),c); }catch(e){}
  if(!out) out=embedCfg(pageSourceFromDom(),c);
  return out;
}

function mirrorLoad(pid){ try{ const o=JSON.parse(localStorage.getItem(MIRROR_KEY)||'null');
  if(!o||o.v!==1||o.pid!==pid||!(o.lastMs>0)||!(Date.now()-o.fullAt<FULL_EVERY)||!Array.isArray(o.docs)) return null; return o; }catch(e){ return null; } }

  try{ const now=Date.now(); localStorage.setItem(MIRROR_KEY,JSON.stringify({v:1,pid:Cloud.cfg.projectId,lastMs:Cloud.lastMs,fullAt:Cloud.fullAt,docs:[...Cloud.docs],tomb:[...Cloud.tomb].filter(([,u])=>now-u<30*864e5)})); }
  catch(e){ ctrace('사본 저장 실패 (브라우저 저장 공간 부족) — 다음 접속은 전체 받기'); try{ localStorage.removeItem(MIRROR_KEY); }catch(x){} } },1200); }
async function tombPurge(){     // 관리자: 14일 지난 삭제 표시를 실제로 정리 (접속당 1번)

  const now=Date.now(), old=[...Cloud.tomb].filter(([id,u])=>now-u>TOMB_KEEP&&!Cloud.docs.has(id)&&!/^(settings|rule)__/.test(id)).slice(0,400); if(!old.length) return;
  try{ const b=Cloud.m.writeBatch(Cloud.db); old.forEach(([id])=>b.delete(Cloud.m.doc(Cloud.db,...CLOUD_ROOT,'docs',id))); await b.commit(); old.forEach(([id])=>Cloud.tomb.delete(id)); ctrace('오래된 삭제 표시 '+old.length+'건 정리'); mirrorSave(); }catch(e){ ctrace('삭제 표시 정리 실패: '+((e&&e.code)||e)); } }
function ctrace(msg){ const d=new Date(); Cloud.trace.push(pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+' '+msg); if(Cloud.trace.length>40) Cloud.trace.shift(); }
const waitMs=ms=>new Promise(r=>setTimeout(r,ms));

// 화면 상태(S) → 클라우드 문서 묶음
function collectDocs(state){
  const m=new Map();
  const st=clean(state.settings); delete st.lastExportAt;                // 기기별 값은 올리지 않음
  m.set('settings__main',{type:'settings',payload:{settings:st,meta:{createdAt:(state.meta&&state.meta.createdAt)||null}}});
  m.set('rule__main',{type:'rule',payload:clean(state.rule)});
  Object.keys(TYPE_OF).forEach(col=>(state[col]||[]).forEach(rec=>{ m.set(TYPE_OF[col]+'__'+safeId(rec.id),{type:TYPE_OF[col],payload:clean(rec)}); }));
  return m;
}
// 클라우드 문서 묶음 → 화면 상태(S)
function cloudBuildState(){
  const st={schemaVersion:SCHEMA}, lists={};
  Object.keys(TYPE_OF).forEach(k=>{ lists[TYPE_OF[k]]=[]; });
  Cloud.docs.forEach((d,id)=>{
    if(d.type==='settings'){ st.settings=(d.payload&&d.payload.settings)||undefined; st.meta=(d.payload&&d.payload.meta)||{}; }
    else if(d.type==='rule') st.rule=d.payload;
    else if(lists[d.type]) lists[d.type].push({o:d.ord||0,id,p:d.payload});
  });
  Object.keys(TYPE_OF).forEach(k=>{ st[k]=lists[TYPE_OF[k]].sort((a,b)=>(a.o-b.o)||(a.id<b.id?-1:1)).map(x=>x.p); });
  if(st.settings&&S&&S.settings) st.settings.lastExportAt=S.settings.lastExportAt||null;
  return st;
}
function cloudBusy(){

  return !!(document.querySelector('#modalRoot > *')||document.querySelector('#drawRoot > *')||editing);
}
function cloudFlush(){      // 받아둔 변경을 화면에 반영 (입력/모달 중이면 끝날 때까지 대기)
  if(!Cloud.needRebuild||!S) return;
  const first=!Cloud.synced;
  if(first){ if(document.querySelector('#drawRoot > *')) return; }          // 첫 동기화: 이 기기의 예전 데이터보다 클라우드가 항상 우선
  else if(Cloud.localDirty||Cloud.pushing||cloudBusy()) return;
  Cloud.needRebuild=false; if(first) Cloud.localDirty=false;
  try{ logFlush(); }catch(e){}
  S=normalize(cloudBuildState()); Repo.save(S); logResetBase(); Cloud.seen=new Set(collectDocs(S).keys());      // 다른 기기에서 온 변경은 기록하지 않음 (그 기기가 기록함)
  if(first){ if(Cloud.mode==='delta'&&!Cloud.serverSeen){ ctrace('저장된 사본으로 먼저 표시 (서버 확인 후 저장 가능)'); }
    else { Cloud.synced=true; ctrace('클라우드 데이터를 화면에 반영 (문서 '+Cloud.docs.size+'개) — 이제 저장 가능'); setTimeout(tombPurge,3000); } }

function cloudOnSnap(snap){

    const id=ch.doc.id;
    if(ch.type==='removed'){ if(Cloud.mode==='delta') return;      // 바뀐 것만 받는 중엔 '목록에서 빠짐'이 삭제를 뜻하지 않음 (삭제는 삭제 표시로 옴)
      Cloud.docs.delete(id); Cloud.base.delete(id); Cloud.ord.delete(id); return; }

    if(d.payload&&d.payload.__del){ Cloud.docs.delete(id); Cloud.base.delete(id); Cloud.ord.delete(id); Cloud.tomb.set(id,u||Date.now()); return; }   // 삭제 표시
    Cloud.tomb.delete(id);

    Cloud.base.set(id,stable(d.payload));

}
function cloudOnSnapErr(e){ ctrace('읽기 오류: '+((e&&e.code)||'')+' '+((e&&e.message)||'')); Cloud.state='error'; Cloud.err=((e&&e.code)||'').replace('firestore/','')==='permission-denied'?'읽기 권한 없음 — 규칙 확인 필요':cloudErr(e); updateCloudUI(); if(S&&!cloudBusy()) render(); }
function cloudMarkDirty(){ if(Cloud.enabled&&canWrite()) Cloud.localDirty=true; }
function cloudSchedule(){ if(!Cloud.enabled||!Cloud.m||!canWrite()) return; clearTimeout(Cloud.timer); Cloud.timer=setTimeout(cloudPush,300); }
const ordFor=id=>{ if(!Cloud.ord.has(id)) Cloud.ord.set(id,Cloud.nextOrd++); return Cloud.ord.get(id); };
async function cloudPush(){

  if(!Cloud.synced&&!Cloud.uploading){ if(!Cloud.empty) Cloud.timer=setTimeout(cloudPush,700); return; }   // 클라우드 데이터를 화면에 반영하기 전에는 절대 올리지 않음 (예전 데이터로 덮어쓰기 방지)

    do{
      Cloud.pushAgain=false;

      cur.forEach((rec,id)=>{ const str=stable(rec.payload); if(Cloud.base.get(id)!==str) ops.push({k:'set',id,rec,str,isNew:!Cloud.base.has(id)}); });

}

function logSnapshot(){ const m=new Map(); collectDocs(S).forEach((v,k)=>m.set(k,{type:v.type,payload:v.payload,str:stable(v.payload)})); return m; }

// 저장할 때마다: 바뀐 문서를 모아 둠 (관리자 모드일 때만)
function logTrack(){
  if(!S) return; if(!LOG.base){ logResetBase(); return; }
  const cur=logSnapshot();
  if(canWrite()){
    cur.forEach((v,k)=>{ const b=LOG.base.get(k); if(!b||b.str!==v.str){ const p=LOG.pend.get(k); if(p) p.after=v; else LOG.pend.set(k,{type:v.type,before:b||null,after:v}); } });
    LOG.base.forEach((b,k)=>{ if(!cur.has(k)){ const p=LOG.pend.get(k); if(p) p.after=null; else LOG.pend.set(k,{type:b.type,before:b,after:null}); } });
    if(LOG.pend.size){ clearTimeout(LOG.timer); LOG.timer=setTimeout(logFlush,3000); }
  }

}

// 모아 둔 변경을 기록으로 저장
function logFlush(){
  clearTimeout(LOG.timer); if(!LOG.pend.size) return;
  const items=[...LOG.pend.values()].filter(p=>(p.before||p.after)&&!(p.before&&p.after&&p.before.str===p.after.str)); LOG.pend.clear();   // 추가 후 바로 삭제·원래대로 되돌린 변경은 제외
  const lines=[], sAdd=new Map(), sDel=new Map();
  const own=new Map(), addOwn=t=>own.set(t,(own.get(t)||0)+1);
  items.forEach(p=>{
    if(p.type==='stock'){
      const b=p.before&&p.before.payload, a=p.after&&p.after.payload;
      if(!b&&a&&a.own==='owned'){ addOwn(a.ownedFrom==='sale'?'[귀속템] 판매 취소 후 길드 귀속 · '+a.name:'[귀속템] 길드 귀속 · '+a.name); return; }
      if(b&&a){
        if(!b.own&&a.own==='owned') addOwn(a.ownedFrom==='sale'?'[귀속템] 판매 취소 후 길드 귀속 · '+a.name:'[귀속템] 길드 귀속 · '+a.name);
        else if(b.own==='owned'&&a.own==='used'){ const u=a.use||{}; addOwn('[귀속템] 사용 · '+a.name+' · '+(u.kind||'')+' '+(u.result||'')+(u.memberName?' · '+u.memberName:'')+(u.memo?' · '+u.memo:'')); }
        else if(b.own==='owned'&&!a.own) addOwn('[귀속템] 귀속 취소 → 미판매 재고 · '+a.name);
        else if(b.own==='used'&&a.own==='owned') addOwn('[귀속템] 사용 취소 · '+a.name);
        return; }
      if(b&&b.own&&!a){ addOwn('[귀속템] 삭제 · '+b.name); return; }
      const x=(a||b), m=a?sAdd:sDel; m.set(x.name,(m.get(x.name)||0)+1); return; }
    try{ lines.push(...logDescribe(p)); }catch(e){ lines.push('['+p.type+'] 변경 (요약 실패)'); }
  });
  own.forEach((n,t)=>lines.push(t+(n>1?' ×'+n:'')));
  sAdd.forEach((n,k)=>lines.push('[재고] 추가 · '+k+(n>1?' ×'+n:'')));
  sDel.forEach((n,k)=>lines.push('[재고] 재고에서 빠짐 · '+k+(n>1?' ×'+n:'')));
  logPush(lines);
}

  const by=((ui.role==='lord'?'군주·':'')+deviceLabel()).slice(0,30), now=new Date();
  try{ const arr=JSON.parse(localStorage.getItem(LOG.LKEY)||'[]'); lines.forEach(t=>arr.push({at:now.toISOString(),by,text:t})); localStorage.setItem(LOG.LKEY,JSON.stringify(arr.slice(-2000))); }catch(e){}
  if(Cloud.enabled&&Cloud.m&&Cloud.db){
    try{ const m=Cloud.m; for(let i=0;i<lines.length;i+=400){ const bt=m.writeBatch(Cloud.db); lines.slice(i,i+400).forEach(t=>bt.set(m.doc(m.collection(Cloud.db,...CLOUD_ROOT,'logs')),{at:m.serverTimestamp(),by,text:t}));
      Promise.resolve(bt.commit()).catch(e=>ctrace('변경 기록 저장 실패: '+((e&&e.code)||e))); } }catch(e){}
  }
  LOGV.fresh=lines.map(t=>({at:now,by,text:t})).reverse().concat(LOGV.fresh||[]);
  if(ui.tab==='log') renderLogTable();
}
/* ---- 로그 탭 (관리자 전용) ---- */
const LOG_KINDS=['공성전','귀속템','군주','입출금','현금','레이드','분배','분배 RULE','재고','재고판매','뽑기','공지','길드원','판매아이템','분류','설정','관리자','데이터','클라우드'];
const LOGV={rows:[],fresh:[],cursor:null,done:false,loading:false,loaded:false,src:''};
const logParse=t=>{ const m=String(t||'').match(/^\[([^\]]+)\]\s*(.*)$/); return m?{kind:m[1],msg:m[2]}:{kind:'기타',msg:String(t||'')}; };
const logTs=t=>{ try{ const d=t&&t.toDate?t.toDate():new Date(t); return isNaN(d)?'':d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }catch(e){ return ''; } };
async function logLoad(reset){
  if(LOGV.loading) return; LOGV.loading=true; if(reset){ LOGV.rows=[]; LOGV.fresh=[]; LOGV.cursor=null; LOGV.done=false; }
  try{
    if(Cloud.enabled&&Cloud.m&&Cloud.db){
      const m=Cloud.m, cs=[m.orderBy('at','desc')]; if(LOGV.cursor&&m.startAfter) cs.push(m.startAfter(LOGV.cursor)); cs.push(m.limit(100));
      const snap=await m.getDocs(m.query(m.collection(Cloud.db,...CLOUD_ROOT,'logs'),...cs));
      const docs=snap.docs||[]; docs.forEach(d=>{ const x=d.data()||{}; LOGV.rows.push({at:x.at,by:x.by||'',text:x.text||''}); });
      LOGV.cursor=docs.length?docs[docs.length-1]:LOGV.cursor; LOGV.done=docs.length<100; LOGV.src='클라우드';
    } else {
      const arr=JSON.parse(localStorage.getItem(LOG.LKEY)||'[]').reverse(); LOGV.rows=arr; LOGV.done=true; LOGV.src='이 브라우저';
    }
    LOGV.loaded=true;
  }catch(e){ LOGV.err=diagHint(e,'read'); }
  LOGV.loading=false; if(ui.tab==='log') renderLogTable();
}
function viewLog(){
  if(!LOGV.loaded&&!LOGV.loading) setTimeout(()=>logLoad(true),0);
  return card('purple','🔒 변경 기록 <span class="small muted" style="margin-left:6px">관리자 전용</span>','<button class="btn sm" data-act="logReload">⟳ 새로고침</button>',
    '<p class="hint" style="margin-top:0">관리자 모드에서 한 <b>모든 입력·수정·삭제</b>가 한 줄씩 기록됩니다. 기록은 <b>지울 수 없고</b> 계속 남습니다. 같은 항목을 연달아 고치면 3초 동안 모아서 1줄로 남깁니다.</p>'+
    '<div class="inl" style="gap:8px;flex-wrap:wrap;margin-bottom:12px"><select data-chg="logKind"><option value="">전체 종류</option>'+LOG_KINDS.map(k=>'<option'+(ui.logKind===k?' selected':'')+'>'+k+'</option>').join('')+'</select>'+
    '<input type="search" data-inp="logq" placeholder="내용·기기 검색 (예: 와꾸, 롱쉴드)" value="'+esc(ui.logq||'')+'" style="width:260px"><span class="small muted" id="logInfo"></span></div><div id="logTable"><div class="small muted">불러오는 중…</div></div>');
}
function renderLogTable(){
  const el=$('#logTable'); if(!el) return;
  if(LOGV.err){ el.innerHTML='<div class="notice bad">기록을 불러오지 못했습니다: '+esc(LOGV.err)+'</div>'; LOGV.err=null; return; }
  const seen=new Set(LOGV.rows.map(r=>r.text+'|'+r.by)), q=(ui.logq||'').trim().toLowerCase();
  const all=(LOGV.fresh||[]).filter(r=>!seen.has(r.text+'|'+r.by)).concat(LOGV.rows);
  const list=all.filter(r=>{ const p=logParse(r.text); return (!ui.logKind||p.kind===ui.logKind)&&(!q||(r.text+' '+r.by).toLowerCase().includes(q)); });
  const info=$('#logInfo'); if(info) info.textContent=(LOGV.src?LOGV.src+' 기록 · ':'')+'불러온 '+all.length+'건 중 '+list.length+'건 표시';
  if(!list.length){ el.innerHTML='<div class="empty">'+(LOGV.loaded?'표시할 기록이 없습니다.':'불러오는 중…')+'</div>'+(LOGV.done?'':'<div style="text-align:center;margin-top:10px"><button class="btn" data-act="logMore">더 오래된 기록 불러오기</button></div>'); return; }
  el.innerHTML='<div class="tablewrap"><table class="tbl fixed" style="min-width:760px"><colgroup><col style="width:160px"><col style="width:120px"><col style="width:110px"><col></colgroup><thead><tr><th>일시</th><th>기기</th><th>종류</th><th>내용</th></tr></thead><tbody>'+
    list.slice(0,1000).map(r=>{ const p=logParse(r.text); return '<tr><td class="nowrap small">'+esc(logTs(r.at))+'</td><td class="small muted">'+esc(r.by||'')+'</td><td><span class="chip">'+esc(p.kind)+'</span></td><td class="wrap">'+esc(p.msg)+'</td></tr>'; }).join('')+'</tbody></table></div>'+
    (LOGV.done?'<div class="small muted" style="text-align:center;margin-top:10px">— 기록의 처음입니다 —</div>':'<div style="text-align:center;margin-top:10px"><button class="btn" data-act="logMore">더 오래된 기록 불러오기</button></div>');
}

  if(viaLink) setTimeout(()=>toast('☁ 연결 링크로 클라우드 설정을 저장했습니다. 이제 이 브라우저에서는 자동으로 연결됩니다'),300);
